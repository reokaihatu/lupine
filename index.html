0d%3D%22M82%2066%20L102%2090%20L86%20102%20Z%20M174%2066%20L154%2090%20L170%20102%20Z%22%20fill%3D%22%23c9852a%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M128%20142%20L106%20180%20L128%20190%20L150%20180%20Z%22%20fill%3D%22%23ffe7b8%22%20opacity%3D%22.92%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M95%20118%20L119%20127%20L112%20138%20L93%20130%20Z%20M161%20118%20L137%20127%20L144%20138%20L163%20130%20Z%22%20fill%3D%22%230b0e1c%22%2F%3E%0A%20%20%3Cpath%20d%3D%22M116%20184%20L140%20184%20L128%20199%20Z%22%20fill%3D%22%230b0e1c%22%2F%3E%3C%2Fsvg%3E">
  <style>
:root {
  --bg: #0e1120; --card: #171b31; --card2: #20253f; --line: #2c3252;
  --text: #eef0ff; --sub: #9aa3c7;
  --amber: #ffbe55; --teal: #4fd6ab; --red: #ff6b7a; --blue: #6aa8ff;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); }
body {
  font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
  line-height: 1.5; touch-action: manipulation;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { max-width: 520px; margin: 0 auto; padding: 14px 14px calc(48px + var(--chatH, 0px)); display: grid; gap: 12px; }
h1 { font-size: 30px; margin: 18px 0 0; letter-spacing: .04em; }
h2 { font-size: 17px; margin: 0 0 8px; }
p { margin: 0; }
.sub { color: var(--sub); font-size: 13px; }
.center { text-align: center; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.stack { display: grid; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row > * { flex: 1; }

input, select {
  width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card2); color: var(--text); font-size: 16px; font-family: inherit;
}
input:focus, select:focus { outline: 2px solid var(--amber); }

.btn {
  display: block; width: 100%; padding: 14px; border: 0; border-radius: 14px;
  font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
  background: var(--card2); color: var(--text);
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .38; cursor: not-allowed; }
.btn.primary { background: var(--amber); color: #1b1300; }
.btn.good { background: var(--teal); color: #05241a; }
.btn.bad { background: var(--red); color: #2a050a; }
.btn.sel { outline: 3px solid #fff; }
.btn.small { padding: 10px; font-size: 14px; }

.top { display: grid; gap: 8px; }
.topline { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); }
.topline b { color: var(--text); }
.hist { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { min-width: 34px; height: 34px; padding: 0 7px; border-radius: 10px; display: flex; gap: 3px; align-items: center; justify-content: center; background: var(--card2); border: 1px dashed var(--line); font-size: 17px; }
.dot small { font-size: 13px; font-weight: 800; }
.dot.cur { border: 2px solid var(--amber); }
.dot.done { background: #3b3a20; border: 1px solid var(--amber); }
.dot.done small { font-size: 15px; }

.rolebar { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 10px 14px; border-radius: 12px; font-family: inherit; font-size: 16px; font-weight: 800; color: var(--text); text-align: left; cursor: pointer; border: 2px solid var(--line); background: var(--card2); }
.rolebar.citizen { border-color: var(--teal); background: #173c33; }
.rolebar.wolf { border-color: var(--red); background: #44202a; }
.rolebar small { font-size: 13px; font-weight: 600; color: #ffd0d6; }
.rb-tap { font-size: 12px; font-weight: 600; color: var(--sub); white-space: nowrap; }
.overlay { cursor: pointer; }

.taskcard { text-align: center; padding: 18px 14px; }
.taskcard .emo { font-size: 54px; line-height: 1.1; }
.taskcard .tname { font-size: 20px; font-weight: 800; margin-top: 4px; }
.need { margin-top: 8px; font-size: 15px; color: var(--sub); }
.need b { font-size: 40px; color: var(--amber); margin: 0 4px; }
.timer { display: inline-block; margin-top: 8px; padding: 4px 14px; border-radius: 99px; background: var(--card2); font-weight: 800; font-variant-numeric: tabular-nums; }
.timer.low { background: var(--red); color: #2a050a; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 6px 10px; border-radius: 99px; background: var(--card2); border: 1px solid var(--line); font-size: 13px; white-space: nowrap; }
.chip.me { border-color: var(--amber); }
.chip.mate { border-color: var(--red); color: #ffc0c7; }
.chip.team { background: #26335c; border-color: var(--blue); }

.picks { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pick { padding: 12px 8px; border-radius: 12px; border: 2px solid var(--line); background: var(--card2); color: var(--text); font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick.on { border-color: var(--amber); background: #3a3017; }
.pick.off { opacity: .45; }

.notice { padding: 10px 12px; border-radius: 12px; background: #2a2440; border: 1px solid #4a3f78; font-size: 13px; }
.notice.warn { background: #3a2a17; border-color: #7a5a2a; }

.votecols { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.votecols h3 { margin: 0 0 6px; font-size: 14px; }
.votecols .y h3 { color: var(--teal); } .votecols .n h3 { color: var(--red); }

.banner { text-align: center; padding: 20px 10px; border-radius: 16px; font-size: 26px; font-weight: 800; }
.banner.citizen { background: #1c4a3b; border: 2px solid var(--teal); }
.banner.aborted { background: var(--card2); border: 2px solid var(--line); }
.banner.wolf { background: #4b2129; border: 2px solid var(--red); }
.score { display: flex; justify-content: center; align-items: baseline; gap: 10px; font-size: 18px; }
.score b { font-size: 44px; }
.bar { height: 14px; border-radius: 99px; background: var(--card2); position: relative; overflow: hidden; margin-top: 8px; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.bar > u { position: absolute; top: 0; bottom: 0; width: 3px; background: #fff; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { padding: 6px 4px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
td.sab { color: var(--red); font-weight: 700; }

.code { font-size: 54px; font-weight: 800; letter-spacing: .18em; text-align: center; color: var(--amber); padding-left: .18em; }

.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pcard {
  display: grid; place-items: center; padding: 0;
  aspect-ratio: 3 / 4; border-radius: 14px; border: 2px solid #7b6dff; color: #fff; font-family: inherit;
  font-size: 44px; font-weight: 800; cursor: pointer;
  background: repeating-linear-gradient(45deg, #2a2561, #2a2561 8px, #342d7c 8px, #342d7c 16px);
}
.pcard:active { transform: scale(.96); }
.pcard.face { background: #fff3d6; color: #1b1300; border-color: var(--amber); cursor: default; width: 96px; font-size: 54px; }
.pcard.flip { animation: flip .45s ease-out; }
@keyframes flip { from { transform: rotateY(90deg) scale(.8); } to { transform: none; } }
.drawn { display: flex; justify-content: center; }
.stepper { display: grid; grid-template-columns: 64px 1fr 64px; gap: 10px; align-items: center; }
.stepper .btn { font-size: 26px; padding: 8px; }
.stepper .amt { text-align: center; font-size: 56px; font-weight: 800; color: var(--amber); line-height: 1.1; }
.slider { width: 100%; height: 34px; accent-color: var(--amber); }
.quick .btn { padding: 9px; }
.hrow { display: grid; gap: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
.hrow:first-of-type { border-top: 0; padding-top: 0; }
.hhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 14px; font-weight: 700; }
.hhead b { font-size: 20px; color: var(--amber); }
.rsvbox { display: grid; gap: 6px; padding: 10px 12px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); }
.rsvhead { display: flex; justify-content: space-between; align-items: baseline; font-size: 14px; font-weight: 700; }
.rsvhead b { font-size: 28px; color: var(--teal); }
.rsvbox .quick .btn { font-size: 13px; }
.deliv { text-align: center; padding: 6px 0 2px; }
.deliv .n { font-size: 56px; font-weight: 800; color: var(--amber); line-height: 1.1; }
.deliv .u { font-size: 14px; color: var(--sub); }

.goal { display: grid; gap: 8px; margin-top: 4px; }
.gl { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--sub); margin-bottom: 3px; }
.gl b { color: var(--text); font-size: 15px; }
.gauge { position: relative; height: 14px; border-radius: 99px; background: var(--card2); overflow: hidden; }
.gauge .zone { position: absolute; top: 0; bottom: 0; background: rgba(79, 214, 171, .28); border-left: 2px solid var(--teal); }
.gauge .zone.capped { border-right: 2px solid var(--teal); }
.gauge .fill { position: absolute; inset: 0 auto 0 0; background: var(--amber); border-radius: 99px; opacity: .92; }
.gauge .fill.over { background: var(--red); }
.gauge.hidden { background: repeating-linear-gradient(45deg, var(--card2), var(--card2) 6px, #272c4d 6px, #272c4d 12px); }

.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(8, 10, 22, .96); display: grid; place-items: center; text-align: center; padding: 24px; }
.overlay[hidden], .toast[hidden] { display: none; }
.overlay .big { font-size: 84px; }
.overlay .rname { font-size: 34px; font-weight: 800; margin: 6px 0; }
.overlay.wolf .rname { color: var(--red); } .overlay.citizen .rname { color: var(--teal); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); z-index: 60; background: #fff; color: #111; padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 700; max-width: 90vw; }

.sabnote { color: var(--red); font-weight: 700; }

/* ---- ミニゲーム ---- */
.board { display: grid; grid-template-columns: repeat(var(--cols, 6), 1fr); gap: 6px; }
.tile {
  aspect-ratio: 1 / 1; min-width: 0; padding: 0; border-radius: 10px; border: 2px solid #7b6dff; color: #fff; font-family: inherit;
  font-size: 15px; font-weight: 800; cursor: pointer; display: grid; place-items: center; overflow: hidden;
  background: repeating-linear-gradient(45deg, #2a2561, #2a2561 6px, #342d7c 6px, #342d7c 12px);
}
.tile:active:not(:disabled) { transform: scale(.94); }
.tile:disabled { cursor: default; }
.tile.taken { opacity: .45; background: var(--card2); border-color: var(--line); color: var(--sub); }
.tile.mytile { background: #fff3d6; color: #1b1300; border-color: var(--amber); opacity: 1; font-size: 18px; }
.tile.mytile.boom { background: #ffd9dd; border-color: var(--red); }
.tile.mytile.flip { animation: flip .45s ease-out; }
.tile.isbomb { border-color: var(--red); box-shadow: 0 0 0 2px var(--red) inset; opacity: 1; color: #ffc0c7; }
.pcard.face.hit { background: #ffd9dd; border-color: var(--red); }
.digits { display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.digits span { min-width: 34px; height: 44px; padding: 0 2px; display: grid; place-items: center; border-radius: 10px; background: var(--card2); border: 2px solid var(--line); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.digits span.cur { border-color: var(--amber); }
.digits span.mine { background: #26335c; border-color: var(--blue); }
.digits.big span { min-width: 56px; height: 76px; font-size: 48px; background: #fff3d6; color: #1b1300; border-color: var(--amber); }
.pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.padbtn { padding: 14px 0; border-radius: 12px; border: 1px solid var(--line); background: var(--card2); color: var(--text); font-family: inherit; font-size: 22px; font-weight: 800; cursor: pointer; }
.padbtn:active { transform: scale(.96); }
.padbtn.ok { background: var(--amber); color: #1b1300; border-color: var(--amber); font-size: 17px; }

/* ---- ロビーのタブ・役職 ---- */
.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tab { padding: 10px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--card2); color: var(--sub); font-family: inherit; font-size: 15px; font-weight: 800; cursor: pointer; }
.tab.on { background: #3a3017; color: var(--text); border-color: var(--amber); }
h3.side { margin: 8px 0 0; font-size: 14px; }
h3.side.citizen { color: var(--teal); }
h3.side.wolf { color: var(--red); }

/* バトル */
.enemybox { text-align: center; }
.enemyname { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.hpbar { height: 10px; border-radius: 6px; background: var(--card2); border: 1px solid var(--line); overflow: hidden; }
.hpbar i { display: block; height: 100%; background: #46c46a; transition: width .4s; }
.hpbar.enemy i { background: #e0566a; }
.allies { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 6px; margin: 8px 0; }
.ally > div:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ally { padding: 6px 8px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); font-size: 12px; display: grid; gap: 3px; }
.ally.me { border-color: var(--amber); }
.ally.down { opacity: .45; }
.cmds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
.cmds .btn small { display: block; font-size: 11px; opacity: .8; }
.softrow { display: block; margin-top: 8px; font-size: 13px; text-align: center; }
.blog { list-style: none; padding: 0; margin: 6px 0; font-size: 13px; display: grid; gap: 3px; }
.blog li.enemy { color: #ff9aa6; }
.blogs { margin-top: 8px; font-size: 12px; }

/* 敵モンスターの大きな表示(属性ごとのオーラ。正体不明のうちは影) */
.enemystage { width: 168px; height: 168px; margin: 2px auto 6px; border-radius: 50%; display: grid; place-items: center; position: relative;
  background: radial-gradient(circle at 50% 40%, var(--aura1) 0%, var(--aura2) 55%, transparent 72%); box-shadow: 0 0 34px var(--aura3); --aura1: #5a4a8a; --aura2: #2b2550; --aura3: #5a4a8a66; }
.enemystage span { font-size: 104px; line-height: 1; filter: drop-shadow(0 6px 8px #0008); animation: floaty 3s ease-in-out infinite; }
.enemystage.fire { --aura1: #ff9a55; --aura2: #7a2a1a; --aura3: #ff6a3a77; }
.enemystage.water { --aura1: #6ac4ff; --aura2: #1a3a6a; --aura3: #3a8aff77; }
.enemystage.grass { --aura1: #8be06a; --aura2: #1f4a2a; --aura3: #4acc6a77; }
.enemystage.unknown span { filter: brightness(0) drop-shadow(0 0 10px #b9a6ff99); opacity: .85; }
.enemystage.struck span { animation: shake .45s ease-in-out; }
.enemystage.defeated span { animation: none; filter: grayscale(1) drop-shadow(0 6px 8px #0008); transform: rotate(-18deg) translateY(8px); opacity: .6; transition: all .5s; }
@keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-10px) rotate(-4deg); } 40% { transform: translateX(10px) rotate(4deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }

/* ダメージの演出 */
.ally { position: relative; }
.pop { position: absolute; left: 50%; top: calc(38% + var(--y, 0px)); font-style: normal; font-weight: 900; font-size: 26px; color: #fff; pointer-events: none; opacity: 0;
  text-shadow: 0 0 6px #000, 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000;
  animation: popup 1.15s ease-out var(--d, 0s) forwards; margin-left: var(--x, 0px); }
.pop.skill { color: #ffe98a; }
.pop.adv { color: #ff8a3a; font-size: 32px; }
.pop.weak { color: #9db0c9; font-size: 24px; }
.pop.ult { color: #ffd23a; font-size: 44px; }
.pop.apop { font-size: 20px; top: 10px; left: 50%; margin-left: 0; text-shadow: 0 0 4px #000, 1px 1px 0 #000; }
.pop.hurt { color: #ff6b7a; }
.pop.heal { color: #5fe08a; }
@keyframes popup { 0% { opacity: 0; transform: translate(-50%, 12px) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -6px) scale(1.25); } 35% { transform: translate(-50%, -14px) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -64px) scale(1); } }
.enemystage::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 5px solid var(--aura1); opacity: 0; pointer-events: none; }
.enemystage.struck::before { animation: ring .7s ease-out; }
.enemystage.struck::after { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #fff; opacity: 0; animation: flash .5s ease-out; pointer-events: none; }
@keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes flash { 0% { opacity: .75; } 100% { opacity: 0; } }
.pop.apop { animation-name: popally; }
@keyframes popally { 0% { opacity: 0; transform: translate(-50%, 6px) scale(.5); } 20% { opacity: 1; transform: translate(-50%, 0) scale(1.2); } 75% { opacity: 1; transform: translate(-50%, -6px) scale(1); } 100% { opacity: 0; transform: translate(-50%, -14px) scale(1); } }

/* 敵の奥義 */
.blog li.enemy.ult { color: #ff5a6e; font-size: 14px; }
.enemystage.enraged { animation: rage 1.4s ease-in-out infinite; }
.enemystage.ultnow span { animation: shake .7s ease-in-out 2; }
.enemystage.ultnow::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, #ff3a4a99 0%, transparent 70%); animation: flash 1s ease-out; pointer-events: none; }
@keyframes rage { 0%, 100% { box-shadow: 0 0 34px var(--aura3); } 50% { box-shadow: 0 0 52px #ff3a4acc; } }
.ultcond { margin: 6px 0; font-size: 12px; text-align: center; border-color: #7a5aff; background: #241f45; }

.pop.crit { color: #ff4fd8; font-size: 40px; text-shadow: 0 0 8px #ff4fd8aa, 1px 1px 0 #000; }
.blog .crit { color: #ff4fd8; font-weight: 900; }
.blog .awaken { color: #ff6b3a; }
/* 敵の覚醒: 赤黒いオーラで一回り大きくなり、燃えるように脈打つ。覚醒した瞬間のラウンドは、画面が赤く光って揺れる */
.enemystage.awakened { --aura1: #ff3a2a; --aura2: #3a0a14; --aura3: #ff2a2acc; animation: awake 1s ease-in-out infinite; }
.enemystage.awakened span { font-size: 118px; filter: saturate(1.5) contrast(1.15) drop-shadow(0 0 14px #ff2a2a) drop-shadow(0 6px 8px #0008); }
.enemystage.awakening span { animation: shake .6s ease-in-out 2; }
.enemystage.awakening::after { content: ''; position: absolute; inset: -22px; border-radius: 50%; background: radial-gradient(circle, #ff2a2aaa 0%, transparent 70%); animation: flash 1.4s ease-out; pointer-events: none; }
.enemystage.awakening::before { border-color: #ff3a2a; animation: ring .9s ease-out 2; }
@keyframes awake { 0%, 100% { box-shadow: 0 0 40px #ff2a2aaa; } 50% { box-shadow: 0 0 66px #ff2a2aee; } }

/* 敵の画像(正体が分かったあと): 横長のイラストを大きく見せる。属性のオーラは枠の光になる */
.enemystage.pic { width: 100%; max-width: 320px; height: auto; aspect-ratio: 1024 / 559; border-radius: 16px; background: #000; }
.enemystage.pic span { display: block; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; font-size: 0; filter: none; animation: none; }
.enemystage.pic img { display: block; width: 100%; height: 100%; object-fit: cover; user-select: none; -webkit-user-drag: none; }
.enemystage.pic::before, .enemystage.pic.struck::after, .enemystage.pic.awakening::after, .enemystage.pic.ultnow::after { border-radius: 16px; }
.enemystage.pic.awakening::after, .enemystage.pic.ultnow::after { inset: 0; }
.enemystage.pic.struck span { animation: shake .45s ease-in-out; }
.enemystage.pic.ultnow span, .enemystage.pic.awakening span { animation: shake .6s ease-in-out 2; }
.enemystage.pic.awakened span { font-size: 0; filter: saturate(1.35) contrast(1.12) brightness(.95) drop-shadow(0 0 0 transparent); }
.enemystage.pic.awakened span::after { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 50% 55%, transparent 35%, #ff1a2a66 100%); mix-blend-mode: screen; pointer-events: none; }
.enemystage.pic.defeated span { animation: none; transform: none; filter: grayscale(1) brightness(.55); opacity: 1; }

/* チャット(画面の下に固定) */
.chat { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; max-width: 520px; margin: 0 auto; background: #12162b; border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 18px #0009; }
.chat[hidden] { display: none; }
.chathead { font-size: 13px; font-weight: 800; padding: 6px 12px 2px; }
.chathead[hidden] { display: none; }
.chathead small { font-weight: 500; color: var(--sub); margin-left: 4px; }
.chatlog { max-height: 26vh; overflow-y: auto; padding: 2px 12px 6px; display: grid; gap: 3px; overscroll-behavior: contain; }
.chatlog.one { max-height: none; overflow: hidden; }
.chatlog.one .cm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm { font-size: 14px; line-height: 1.4; word-break: break-all; }
.cm b { color: var(--amber); font-size: 12px; margin-right: 4px; }
.cm.me b { color: var(--teal); }
.cdiv { text-align: center; font-size: 11px; color: var(--sub); margin: 4px 0 1px; }
.cempty { font-size: 12px; color: var(--sub); text-align: center; padding: 4px; }
.chatform { display: flex; gap: 6px; padding: 6px 10px 8px; align-items: center; }
.chatform input { flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; }
.chattoggle { position: relative; flex: 0 0 auto; width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--card2); color: var(--text); font-size: 20px; cursor: pointer; }
.chattoggle[hidden] { display: none; }
.chattoggle i { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--red); color: #fff; font-size: 11px; font-style: normal; font-weight: 800; line-height: 18px; text-align: center; }
.chattoggle i[hidden] { display: none; }
.chatsend { flex: 0 0 auto; height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--amber); color: #1b1300; font-size: 15px; font-weight: 800; font-family: inherit; cursor: pointer; }
/* 数字ゲーム専用チャット: 吹き出しが入力欄の上に重なって出て、時間が来ると消える */
.chat.pair .chatlog { position: absolute; left: 0; right: 0; bottom: 100%; max-height: none; overflow: visible; pointer-events: none; padding: 0 12px 6px; display: grid; gap: 4px; }
.chat.pair .chathead { background: #12162b; }
.bub { justify-self: start; max-width: 88%; padding: 7px 12px; border-radius: 14px 14px 14px 4px; background: #2b3260; color: #fff; font-size: 17px; font-weight: 700; letter-spacing: .04em; word-break: break-all; box-shadow: 0 2px 8px #0008; animation: bubfade linear forwards; }
.bub b { color: var(--amber); font-size: 11px; margin-right: 6px; letter-spacing: 0; }
.bub.me { justify-self: end; background: #1f5f4e; border-radius: 14px 14px 4px 14px; }
.bub.me b { color: #bff5e4; }
@keyframes bubfade { 0%, 72% { opacity: 1; } 100% { opacity: 0; } }

/* 状態異常(火傷・命中率低下・火力ダウン) */
.fxb { font-style: normal; font-size: 11px; font-weight: 800; margin-left: 3px; padding: 0 4px; border-radius: 8px; background: #3a2a2a; }
.fxb.blind { background: #2a2f4a; } .fxb.weak { background: #3a2f1f; }
.blog li.fxl { color: #ffb36b; }

/* バトルのコマンド選択: ボタンは1行、説明は選んだときだけ出す */
.cmds.one .btn { padding: 12px 10px; }
.cmds .btn.on { outline: 3px solid var(--amber); background: #2d2a1f; }
.cmdinfo { margin-top: 4px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: #11172a; display: grid; gap: 8px; }
.cmdinfo p { margin: 0; font-size: 14px; line-height: 1.5; }
.cmdinfo .softrow { margin: 0; text-align: left; }
.cmdinfo small { display: block; text-align: center; font-size: 11px; }
.ally small { white-space: nowrap; font-size: 11px; }
.cmdinfo .softrow input { width: auto; display: inline-block; margin: 0 6px 0 0; vertical-align: middle; }
.cmds .btn.on { color: #fff; }
.ally { min-width: 0; overflow: hidden; padding: 6px 6px; }
.ally small { font-size: 10.5px; }
.ally small { font-size: 10px; letter-spacing: -.2px; }
.sabcmd { margin: 6px 0; font-size: 12px; text-align: center; border-color: #ff5a5a; background: #3a1f25; }
.blog .tot { font-weight: 700; }

/* 音の設定(BGM・SE。個人設定) */
.soundbtn { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); right: 6px; z-index: 60; width: 32px; height: 32px; padding: 0; border-radius: 50%; border: 1px solid #3a4266; background: rgba(20, 24, 44, .85); color: #fff; font-size: 16px; line-height: 1; cursor: pointer; }
.soundpanel { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 42px); right: 6px; z-index: 61; width: min(340px, calc(100vw - 12px)); background: #181d36; border: 1px solid #4a5384; border-radius: 14px; padding: 12px 14px; box-shadow: 0 8px 28px rgba(0, 0, 0, .55); }
.soundpanel[hidden] { display: none; }
.sp-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.sp-close { background: none; border: 0; color: #fff; font-size: 18px; padding: 2px 6px; cursor: pointer; }
.sp-row { display: block; margin: 12px 0 4px; font-size: 14px; }
.sp-row .slider { width: 100%; margin-top: 6px; }
.sp-btns { display: flex; gap: 8px; margin: 10px 0; }
.sp-btns .btn { flex: 1; }

/* 観戦(神視点) */
.godbar { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 12px; background: #2b2250; border: 1px solid #6a58c8; font-weight: 700; font-size: 14px; }
.godbar small { color: var(--sub); font-weight: 600; }
.gturn { display: flex; align-items: center; gap: 12px; }
.gturn .emo { font-size: 34px; }
.ggrid { display: grid; gap: 6px; }
.gtile { display: grid; place-items: center; gap: 2px; padding: 8px 2px; border-radius: 10px; background: var(--card2); border: 1px solid var(--line); min-height: 52px; text-align: center; }
.gtile b { font-size: 18px; }
.gtile small { font-size: 10px; line-height: 1.1; color: var(--sub); word-break: break-all; }
.gtile.mine { border-color: var(--red); background: #44202a; }
.gtile.plus { border-color: #e3b341; background: #3b3113; }
.gtile.taken { outline: 2px solid var(--blue); }
.genemy { display: flex; align-items: center; gap: 12px; }
.genemy .emo { font-size: 38px; }
.gallies { display: grid; gap: 8px; }
.gally { padding: 8px 10px; border-radius: 12px; background: var(--card2); border: 1px solid var(--line); display: grid; gap: 4px; }
.gally.dead { opacity: .5; }
.gah { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 14px; }
.gam { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--sub); }
.gam b { color: var(--text); }
.mono { font-family: ui-monospace, Menlo, monospace; letter-spacing: 1px; }
.fold { padding: 0; overflow: hidden; }
.foldhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%; padding: 12px 14px; background: none; border: 0; color: var(--text); font: inherit; font-size: 16px; font-weight: 700; text-align: left; cursor: pointer; }
.foldhead small { font-weight: 500; }
.foldhead i { font-style: normal; color: var(--sub); }
.foldbody { padding: 0 14px 14px; }
.foldtools { display: flex; gap: 8px; }
.foldtools .btn { flex: 1; }
.gdmg { color: #ffd166; }

.netbar { position: fixed; left: 0; right: 0; top: 0; z-index: 60; padding: calc(env(safe-area-inset-top, 0px) + 6px) 12px 6px; background: #7a2a1d; color: #fff; font-size: 13px; font-weight: 700; text-align: center; }

.brand { display: flex; align-items: center; gap: 14px; margin: 4px 0 16px; }
.brand > svg { width: 56px; height: 56px; flex: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,.45)); }
.brandtxt { display: flex; flex-direction: column; gap: 6px; color: var(--text); min-width: 0; }
.brandtxt svg { height: 19px; width: auto; max-width: 100%; }
.brandtxt small { color: #b4bcdf; font-size: 12px; font-weight: 600; letter-spacing: .16em; }

</style>
</head>

const randInt = (lo, hi, rng = Math.random) => lo + Math.floor(rng() * (hi - lo + 1));

function shuffle(arr, rng = Math.random) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// 人数に応じた人狼数 (6人→1, 7〜10人→2, 11〜14人→3, 15〜18人→4, 19〜20人→5)
function wolfCount(n) {
  return Math.max(1, Math.floor((n + 1) / 4));
}

// 人狼の最大数(半数未満)。5人なら2、6人なら2、7人なら3、10人なら4
function maxWolves(n) {
  return Math.max(1, Math.floor((n - 1) / 2));
}

// ホストの設定から実際の人狼数を決める。0(または未指定)=自動、それ以外は人数に収まる範囲に丸める
function resolveWolves(n, setting) {
  const s = Math.round(Number(setting));
  if (!Number.isFinite(s) || s <= 0) return wolfCount(n);
  return Math.min(s, maxWolves(n));
}

// どの役職も使える回数をロビーで決められる(ROLE_USES。99=無制限)。村人側は人数、人狼側は入る確率を決める。

// そのターンまでなら確認できるか(turn は現在のターン番号)

// 通常のタスク1回に必要な人数の幅
function needRange(n) {
  const min = Math.max(2, Math.round(n * 0.2));
  const max = Math.max(min + 1, Math.round(n * 0.4));
  return [min, Math.min(max, n)];
}

// 大型タスクを含めた必要人数の幅(人数が増えるほど、通常の上限を超える大型タスクが出る)。6人未満は大型なし。
function needRangeMax(n) {
  const [lo, hi] = needRange(n);
  return [lo, Math.max(hi, Math.min(n - 1, Math.round(n * 0.6)))];
}

// 全ターンの必要人数の合計(どのゲームでもほぼ同じ。通常タスクの平均 × ターン数)
function totalSeats(n, turns) {
  const [lo, hi] = needRange(n);
  return Math.round(turns * (lo + hi) / 2);
}

// 全ターンの必要人数を決める。合計は totalSeats に一致する。
// 人数が多いとき(大型タスクが出せるとき)は、1〜(ターン数÷3)回、大型タスク(通常の上限を超える人数)が入る。
// 残りのターンは通常の幅の中で、合計が合うように割り振る。
function rollNeeds(n, turns, rng = Math.random) {
  const [lo, hi] = needRange(n);
  const [, hiMax] = needRangeMax(n);
  const S = totalSeats(n, turns);
  const maxBig = hiMax > hi ? Math.max(1, Math.floor(turns / 3)) : 0;
  for (let attempt = 0; attempt < 200; attempt++) {
    const bigCount = maxBig ? randInt(1, maxBig, rng) : 0;
    const needs = Array(turns).fill(0);
    const order = shuffle([...Array(turns).keys()], rng);
    const bigTurns = order.slice(0, bigCount);
    let rest = S;
    for (const t of bigTurns) { needs[t] = randInt(hi + 1, hiMax, rng); rest -= needs[t]; }
    const light = order.slice(bigCount);
    if (rest < lo * light.length || rest > hi * light.length) continue;
    light.forEach((t) => { needs[t] = lo; });
    rest -= lo * light.length;
    while (rest > 0) { // 余りを、まだ上限に達していないターンへ1人ずつランダムに配る
      const open = light.filter((t) => needs[t] < hi);
      needs[open[Math.floor(rng() * open.length)]] += 1;
      rest -= 1;
    }
    return needs;
  }
  // 大型タスクを入れられなかったときは、通常の幅の中だけで合計を合わせる
  const needs = Array(turns).fill(lo);
  let rest = S - lo * turns;
  while (rest > 0) {
    const open = needs.map((v, i) => i).filter((i) => needs[i] < hi);
    needs[open[Math.floor(rng() * open.length)]] += 1;
    rest -= 1;
  }
  return needs;
}

// ターンごとのタスクを決める。必要人数が通常の上限を超えるターンには、大型タスクを使う。
function pickTasks(needs, n, rng = Math.random) {
  const [, hi] = needRange(n);
  const normals = shuffle(TASKS, rng);
  const bigs = shuffle(BIG_TASKS, rng);
  return needs.map((v) => (v > hi && bigs.length ? bigs.shift() : normals.shift()));
}

// 敵のHP。人数が多いほど運のぶれが平均されて勝ちやすくなるので、1人あたりのHPを少しずつ増やす(hpGrowCap 人で頭打ち)
const battleHp = (k) => Math.round(k * (BATTLE.hpPerSeat + BATTLE.hpGrow * (Math.min(k, BATTLE.hpGrowCap) - 2)));

// ミニゲームの種類(探索する人数で決まる)
function playKind(k) {
  return k === 2 ? 'memory' : 'mine';
}

// 1ターンの報酬の合計の分散(運のぶれ)。1人あたりの数字の分散(4〜16の一様乱数=14)に加えて、
// 地雷ゲームでは「地雷を誰かが引くと全員が一斉に減る」ぶんの相関が入る(確率はおよそ1/perSeat)。
function turnVar(k, battle = false) {
  if (battle) { // バトル: 勝てば全員の合計は(ほぼ)一定、負ければ loseFactor 倍。勝ち負けのぶれだけが運になる
    const p = BATTLE.nominalWin;
    return p * (1 - p) * ((1 - BATTLE.loseFactor) * REWARD.avg * k) ** 2;
  }
  const k2 = MINE.max - MINE.min + 1;
  const v = (k2 * k2 - 1) / 12;
  if (playKind(k) === 'memory') return v * k;
  const p = 1 / MINE.perSeat;
  const mean = (MINE.min + MINE.max) / 2;
  // +1カード(1/perSeat の確率で誰かが引き、追加で1枚ぶんの数字が入る)のぶんのぶれ
  const pe = 1 / MINE.perSeat;
  const plusVar = pe * (mean * mean + v) - (pe * mean) ** 2;
  return v * k + plusVar + p * (1 - p) * ((1 - MINE.penalty) * mean * k) ** 2;
}

// 1人あたりの報酬の平均。地雷ゲームは「地雷が出ると全員が(1-penalty)ぶん減る」ぶん少し下がり(地雷の確率はおよそ1/perSeat)、
// +1カード(チームのだれかが1/perSeat の確率で引く)のぶん、チーム全体で1枚ぶんが上乗せされる。
function seatMean(k, battle = false) {
  if (battle) return REWARD.avg * (BATTLE.nominalWin + (1 - BATTLE.nominalWin) * BATTLE.loseFactor) * (1 - BATTLE.koPenalty * BATTLE.nominalKo * k);
  if (playKind(k) === 'memory') return REWARD.avg;
  const base = (MINE.min + MINE.max) / 2 * (1 - (1 - MINE.penalty) / MINE.perSeat);
  return base * (1 + 1 / (MINE.perSeat * k));
}

// バトルが発生するかどうかが決まる前(上級者の目標)は、確率 chance で混ぜた平均と分散を使う
const mixMean = (k) => (1 - BATTLE.chance) * seatMean(k) + BATTLE.chance * seatMean(k, true);
function mixVar(k) {
  const c = BATTLE.chance;
  return (1 - c) * turnVar(k) + c * turnVar(k, true) + c * (1 - c) * (k * (seatMean(k) - seatMean(k, true))) ** 2;
}

// 同じ人数・ターン数なら毎回同じになる分散の見積もり(固定の乱数で必要人数を何通りか作って平均する)
const varCache = new Map();
function expectedStats(n, turns) {
  const key = `${n}:${turns}`;
  if (!varCache.has(key)) {
    let a = 123456789;
    const rng = () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    let sum = 0; let mean = 0;
    const R = 60;
    for (let i = 0; i < R; i++) {
      const needs = rollNeeds(n, turns, rng);
      sum += needs.reduce((x, k) => x + mixVar(k), 0);
      mean += needs.reduce((x, k) => x + k * mixMean(k), 0);
    }
    varCache.set(key, { var: sum / R, mean: mean / R });
  }
  return varCache.get(key);
}

// ゲーム開始時に全ターンの必要人数・タスクを決め、モードに応じた目標値を算出する
//   戻り値: { mode, needs, tasks, expected, target, cap, reserveTarget(上級者のみ) }
function rollPlan(n, turns, mode = 'beginner', rng = Math.random, opts = {}) {
  const needs = rollNeeds(n, turns, rng); // 合計は常に totalSeats(n, turns)
  const tasks = pickTasks(needs, n, rng);
  // 各ターン、一定の確率で通常タスクの代わりにバトルが発生する(必要人数はそのまま)
  const battles = needs.map(() => rng() < (opts.battleChance !== undefined ? opts.battleChance : BATTLE.chance));
  battles.forEach((b, i) => { if (b) tasks[i] = BATTLE_TASK; });
  const seats = needs.reduce((a, b) => a + b, 0);
  const expected = needs.reduce((a, k, i) => a + k * seatMean(k, battles[i]), 0); // 全員の報酬の期待値の総量
  // 目標は「自動の人狼数」で決める。ホストが人狼の数を変えても目標は変わらない(増やせば市民が不利、減らせば有利になる)
  const wf = wolfCount(n) / n;
  const luck = opts.luck !== undefined ? opts.luck : LUCK;
  const allowance = luck * Math.sqrt(needs.reduce((a, k, i) => a + turnVar(k, battles[i]), 0));
  const jitter = opts.jitter !== undefined ? opts.jitter : JITTER;
  const shift = Math.round((rng() * 2 - 1) * jitter * expected);
  const plan = { mode, needs, tasks, battles, expected };
  if (mode === 'advanced') {
    // 上級者: 目標は「ターン数 × 参加人数」だけで決まる。必要人数の組み合わせやゆらぎには左右されない。
    // 必要人数がランダムに振れる分の運は、許容(allowance)に含める。
    const tol = opts.tolerance !== undefined ? opts.tolerance : ADVANCED.tolerance;
    const share = opts.share !== undefined ? opts.share : ADVANCED.share;
    const over = opts.over !== undefined ? opts.over : ADVANCED.over;
    const base = expectedStats(n, turns).mean; // 必要人数の合計はほぼ固定なので、ターン数と人数だけで決まる
    const pool = base * (1 - wf * tol) - luck * Math.sqrt(expectedStats(n, turns).var);
    plan.expected = Math.round(base);
    const boost = opts.boost !== undefined ? opts.boost : TARGET_BOOST;
    plan.target = Math.round(pool * share * boost);
    plan.reserveTarget = Math.round(pool * (1 - share) * boost);
    plan.cap = plan.target + over; // 納品の上限(目標より over 個まで)
  } else {
    const tol = opts.tolerance !== undefined ? opts.tolerance : BEGINNER.tolerance;
    const win = opts.window !== undefined ? opts.window : BEGINNER.window;
    const boost = opts.boost !== undefined ? opts.boost : TARGET_BOOST;
    plan.target = Math.round((expected * (1 - wf * tol) - allowance + shift) * boost);
    plan.cap = plan.target + Math.max(4, Math.round(expected * win));
  }
  return plan;
}

// ---- ミニゲーム ----

// 盤面の数字。min〜max のすべての数字が必ず1枚以上入り、残りは min〜max のランダム。
function boardValues(size, rng) {
  const all = [];
  for (let v = MINE.min; v <= MINE.max; v++) all.push(v);
  const extra = Array.from({ length: Math.max(0, size - all.length) }, () => randInt(MINE.min, MINE.max, rng));
  return shuffle([...all, ...extra], rng);
}

// 地雷ゲームの盤面を作る。size 枚のタイルそれぞれに数字があり、1枚だけが地雷、別の1枚だけが「+1カード」。
//   +1カードを引いた人は、もう1枚追加でタイルを引ける(数字は両方ぶん入る)。+1カードも数字をもつので、人狼からは普通のタイルに見える。
function mineBoard(k, rng = Math.random) {
  const size = Math.max(MINE.perSeat, k * MINE.perSeat, MINE.max - MINE.min + 1);
  const mine = Math.floor(rng() * size);
  let plus = Math.floor(rng() * (size - 1));
  if (plus >= mine) plus += 1; // 地雷とは別のタイル
  // 人狼に見せるヒント: 地雷は、この hintCount 枚のどれかにある(本物の地雷を含む)
  const others = shuffle([...Array(size).keys()].filter((i) => i !== mine), rng).slice(0, MINE.hintCount - 1);
  const hint = shuffle([mine, ...others], rng);
  return {
    size,
    cols: k >= MINE.wideFrom ? MINE.colsWide : MINE.cols,
    mine,
    hint,
    plus,
    values: boardValues(size, rng),
  };
}

// 地雷での減額(四捨五入。penalty=0.75 なら25%減って75%を受け取る)
const penalize = (v) => Math.round(v * MINE.penalty);

// 地雷ゲームの結果から全員の報酬を決める。picks[id]=タイル番号。
//   戻り値: { rewards, hit(地雷が出たか), hitBy(引いた人。いなければ null), tiles(それぞれの数字) }
//   extras[id]=+1カードを引いた人が追加で引いたタイル番号(ない人は未定義)。数字は1枚目と足される。
function mineRewards(team, board, picks, extras = {}) {
  const tiles = {};   // それぞれが引いた数字の合計(地雷の影響を受ける前)
  let hitBy = null;
  for (const id of team) {
    tiles[id] = board.values[picks[id]];
    if (picks[id] === board.mine) hitBy = id;
    if (extras[id] !== undefined) {
      tiles[id] += board.values[extras[id]];
      if (extras[id] === board.mine) hitBy = id;
    }
  }
  const hit = hitBy !== null;
  const rewards = {};
  for (const id of team) {
    rewards[id] = hit ? penalize(tiles[id]) : tiles[id];
  }
  const plusBy = team.find((id) => picks[id] === board.plus) ?? null;
  return { rewards, hit, hitBy, tiles, plusBy };
}

// ---- バトル ----

const SAB_CMDS = ['attack', 'charge', 'skill']; // 妨害の追加効果が乗る候補(たたかう・チャージ・スキル)

// バトルの初期状態。team=[id...]。属性は各自ランダム、奥義の必要ポイントも各自ランダム。
function battleInit(team, rng = Math.random, wolves = []) {
  const pick = (arr) => arr[Math.floor(rng() * arr.length)];
  const st = {
    round: 1, rounds: BATTLE.rounds,
    enemy: { attr: pick(ATTRS), maxHp: battleHp(team.length), hp: battleHp(team.length) },
    team: [...team], hp: {}, attr: {}, need: {}, charge: {}, charged: {}, enemyBuff: 0, needFree: {}, dealt: {}, down: {}, // down: 戦闘不能になったラウンド
    enemyCond: pick(ENEMY_CONDS), ultCd: 0, attacked: {}, allyUlt: false, advHit: false, shared: false, burst: false, maxRound: 0, // 敵の奥義の発動条件と、その達成状況
    revealed: {}, enemyKnown: false, // 属性は、スキルを使うまでチームの他の人には分からない。スキルが使われると、その人の属性と敵の属性が明らかになる
    wolves: Object.fromEntries(wolves.filter((id) => team.includes(id)).map((id) => [id, true])), fx: {}, // wolves: バトルに参加している人狼(状態異常の判定用) / fx: 状態異常の残りラウンド
    over: false, win: false,
  };
  for (const id of team) {
    st.fx[id] = { burn: 0, blind: 0, weak: 0 };
    st.hp[id] = BATTLE.allyHp; st.attr[id] = pick(ATTRS); st.charge[id] = 0; st.charged[id] = 0; st.dealt[id] = 0;
    st.need[id] = randInt(BATTLE.needMin, BATTLE.needMax, rng);
    if (st.wolves[id]) st.needFree[id] = true; // 人狼は、奥義に使うポイント数を自由に決められる(最初に使った数に固定される)
  }
  st.sabCmd = pick(SAB_CMDS); // 人狼の「妨害」の追加効果が乗るコマンド(バトルごとにランダム。バトルの始めに人狼にだけ知らされる)
  return st;
}

const alive = (st, id) => st.hp[id] > 0;
// 奥義の威力(倍率)は、必要ポイントが多いほど大きい。1ラウンドあたりの威力(チャージ+奥義で need+1 ラウンドかかる)が、必要ポイントによらず同じになる: 必要2→×4.5、3→×6.0、4→×7.5
const ultMult = (need) => BATTLE.ultPer * (need + 1);

// 敵の奥義の発動条件を満たしているか(全プレイヤー: 戦闘不能の人は数えない)
function battleCondMet(st) {
  if (st.enemyCond === 'all') return st.team.every((id) => st.attacked[id] || st.hp[id] <= 0);
  if (st.enemyCond === 'ult') return st.allyUlt;
  if (st.enemyCond === 'share') return st.shared;
  if (st.enemyCond === 'burst') return st.burst;
  if (st.enemyCond === 'charge') return st.team.some((id) => alive(st, id) && st.charge[id] > 0);
  return st.advHit;
}
// 敵がこのラウンドに奥義を使うか: HPが半分を切っている・条件を満たしている・クールダウンが終わっている
const battleUltReady = (st) => st.enemy.hp < st.enemy.maxHp * BATTLE.enemyUltHp && battleCondMet(st) && st.ultCd <= 0;

// コマンドが使えるか(戦闘不能は不可、奥義はポイントがたまっているときだけ)
//   share は、分け先 target が生きている別の味方で、HPが減っていて、自分のHPが2以上のときだけ(自分が0になる分は渡せない)
function battleCanUse(st, id, cmd, target) {
  if (!alive(st, id) || st.over) return false;
  if (cmd === 'ultimate') return st.needFree[id] ? st.charge[id] >= 1 : st.charge[id] >= st.need[id];
  if (cmd === 'share') return target !== id && st.team.includes(target) && alive(st, target) && st.hp[target] < BATTLE.allyHp && st.hp[id] > 1;
  return cmd === 'attack' || cmd === 'charge' || cmd === 'skill';
}

// 敵の奥義の状態異常。生きている味方が確率でかかる(人狼のほうが確率が高い)。エルフキングは「回復」か「火力ダウン」。
function applyUltStatus(st, log, rng) {
  let kind = { fire: 'burn', water: 'blind', grass: 'elf' }[st.enemy.attr];
  if (kind === 'elf') kind = rng() < BATTLE.elfHealRate ? 'heal' : 'weak';
  const fx = { kind, ids: [] };
  if (kind === 'heal') {
    const wolfIn = st.team.some((id) => st.wolves[id]); // 人狼が参加していると、回復しやすく、回復量も上限の乱数
    if (rng() < (wolfIn ? BATTLE.statusChanceWolf : BATTLE.statusChance)) {
      const pct = BATTLE.healPct * (wolfIn ? 1 + BATTLE.healSpread : 1 + (rng() * 2 - 1) * BATTLE.healSpread);
      const amount = Math.max(0, Math.min(st.enemy.maxHp - st.enemy.hp, Math.round(st.enemy.maxHp * pct)));
      st.enemy.hp += amount;
      fx.heal = amount;
    } else fx.heal = 0;
  } else {
    const turns = { burn: BATTLE.burnTurns, blind: BATTLE.blindTurns, weak: BATTLE.weakTurns }[kind];
    for (const id of st.team) {
      if (!alive(st, id)) continue;
      if (rng() < (st.wolves[id] ? BATTLE.statusChanceWolf : BATTLE.statusChance)) { st.fx[id][kind] = turns; fx.ids.push(id); }
    }
  }
  log.fx = fx;
}

// 1ラウンドを処理する。cmds[id] = { cmd, soft }(未入力や使えないコマンドは「たたかう」)。
// 戻り値: そのラウンドのログ { round, acts:[{id,cmd,dmg,mult,gain?}], hits:[{id,dmg}], enemyHp, over, win }
function battleRound(st, cmds, rng = Math.random) {
  const acts = [];
  const sabs = []; // 「妨害する」をつけて妨害コマンドを使った人狼
  const living = st.team.filter((id) => alive(st, id));
  for (const id of living) {
    const c = cmds[id] || {};
    const cmd = battleCanUse(st, id, c.cmd, c.target) ? c.cmd : 'attack';
    const roll = c.soft ? BATTLE.softMin + rng() * (BATTLE.softMax - BATTLE.softMin) : BATTLE.rollMin + rng() * (BATTLE.rollMax - BATTLE.rollMin); // 人狼の手加減=乱数の下位(softMin〜softMax)
    const act = { id, cmd, dmg: 0 };
    // クリティカル(2人のときだけ)。手加減している人狼にも出る(手加減の下位乱数のあとに、クリティカルで増える)
    const crit = st.team.length === BATTLE.critSize && rng() < BATTLE.critChance;
    if (cmd === 'charge') { st.charge[id] += BATTLE.chargeGain; st.charged[id] += BATTLE.chargeGain; act.charge = st.charged[id]; } // 全員に見えるのは「ためた累計」(奥義で減らない)
    else if (cmd === 'share') { // 分け与える量は、本人が決めた量(既定は shareAmount)・shareMax・分け先の空き・自分のHP(自分は0にならない)の最小
      const want = Number.isFinite(c.amount) ? Math.max(1, Math.floor(c.amount)) : BATTLE.shareAmount;
      const amount = Math.max(0, Math.min(want, BATTLE.shareMax, BATTLE.allyHp - st.hp[c.target], st.hp[id] - 1));
      st.hp[id] -= amount; st.hp[c.target] += amount; act.target = c.target; act.amount = amount;
    }
    else if (cmd === 'attack') act.dmg = Math.round(BATTLE.atk * roll);
    else if (cmd === 'skill') { act.attr = st.attr[id]; act.enemyAttr = st.enemy.attr; act.mult = attrMult(st.attr[id], st.enemy.attr); act.dmg = Math.round(BATTLE.atk * BATTLE.skillMult * act.mult * roll); }
    else {
      if (st.needFree[id]) { // 人狼の最初の奥義: 使うポイント数を決める(1〜たまっている数。決めなければ、必要ポイントか、たまっている数)。決めた数が、以後の必要ポイントに固定される
        const want = Number.isFinite(c.spend) ? Math.floor(c.spend) : Math.min(st.charge[id], st.need[id]);
        st.need[id] = Math.max(1, Math.min(st.charge[id], want));
        st.needFree[id] = false;
      }
      st.charge[id] -= st.need[id]; act.dmg = Math.round(BATTLE.atk * ultMult(st.need[id]) * roll);
    } // 消費したポイントは、ログにも出さない
    if (crit && act.dmg > 0) { act.dmg = Math.round(act.dmg * BATTLE.critMult); act.crit = true; }
    const F = st.fx[id];
    if (F.weak > 0 && act.dmg > 0) { act.dmg = Math.round(act.dmg * BATTLE.weakMult); act.weak = true; } // 火力ダウン
    if (F.blind > 0 && act.dmg > 0 && rng() < (st.wolves[id] ? BATTLE.blindMissWolf : BATTLE.blindMiss)) { act.dmg = 0; act.miss = true; } // 命中率低下: 外れる
    if (c.sab && st.wolves[id] && cmd === st.sabCmd) sabs.push(id); // 人狼の妨害: このバトルの「妨害コマンド」に「妨害する」をつけて使うと、追加効果の判定が入る
    acts.push(act);
  }
  let total = 0;
  for (const a of acts) {
    st.dealt[a.id] += a.dmg; total += a.dmg;
    if (a.dmg > 0 || a.miss) st.attacked[a.id] = true; // 敵の奥義の条件の記録(外れた攻撃も、攻撃したことになる)
    if (a.cmd === 'ultimate') st.allyUlt = true;
    if (a.cmd === 'share' && a.amount > 0) st.shared = true;
    if (a.cmd === 'skill' && a.mult > 1 && !a.miss) st.advHit = true;
    if (a.cmd === 'skill') { st.revealed[a.id] = true; st.enemyKnown = true; } // スキルを使うと、自分の属性と敵の属性が全員に明らかになる
  }
  st.maxRound = Math.max(st.maxRound, total); // 1ラウンドの最大ダメージ(発動条件「大ダメージ」の目安)
  if (total >= battleBurst(st.team.length)) st.burst = true;
  st.enemy.hp = Math.max(0, st.enemy.hp - total);
  const log = { round: st.round, acts, total, hits: [], enemyHp: st.enemy.hp, over: false, win: false }; // total: そのラウンドの味方の与ダメージの合計(個別のダメージは、戦闘中は本人にも見せない)
  for (const id of living) { const F = st.fx[id]; if (F.blind > 0) F.blind -= 1; if (F.weak > 0) F.weak -= 1; } // このラウンドで効いた分を消費(敵がこれからかける分は、次のラウンドから満額で効く)
  if (st.enemy.hp <= 0) { st.over = true; st.win = true; }
  else {
    // 敵の攻撃: 生きている味方から、重複なしでランダムに選ぶ(単体攻撃)
    const pool = shuffle(living, rng).slice(0, battleTargets(st.team.length, rng));
    const ultNow = battleUltReady(st);
    if (st.ultCd > 0) st.ultCd -= 1;
    const buff = st.enemyBuff > 0 ? BATTLE.sabEnemyMult : 1; // 人狼の妨害で敵が強化されている間は、攻撃力アップ
    if (st.enemyBuff > 0) st.enemyBuff -= 1;
    const rage = (1 + Math.max(0, st.round - st.rounds) * BATTLE.extraRage) * buff; // 敵が覚醒すると、敵の攻撃が1ラウンドごとに強くなる
    if (st.round > st.rounds) { log.rage = 1 + (st.round - st.rounds) * BATTLE.extraRage; if (st.round === st.rounds + 1) log.awaken = true; }
    if (buff > 1) log.buffed = true;
    const singles = pool.map((id) => ({ id, dmg: Math.round(BATTLE.enemyDmg * rage * (1 + (rng() * 2 - 1) * BATTLE.enemySpread)) }));
    let hits = singles;
    if (ultNow) { // 敵の奥義: 全員に大ダメージ(単体攻撃や全体攻撃のかわり)
      hits = living.map((id) => ({ id, dmg: Math.round(BATTLE.enemyUltDmg * rage * (1 + (rng() * 2 - 1) * BATTLE.enemySpread)) }));
      log.ult = true;
      st.ultCd = BATTLE.enemyUltCooldown;
    }
