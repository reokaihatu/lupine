      result: g.result ? { hit: g.result.hit, hitBy: g.result.hitBy, plusBy: g.result.plusBy, rewards: g.result.rewards } : undefined,
    };
  }
  if (g.kind === 'memory') {
    return {
      kind: 'memory', stage: room.stage, sub: g.sub, round: g.round, rounds: G.MEMORY.rounds, half: G.MEMORY.half,
      seqs: g.seqs, entries: g.entries, drafts: g.drafts, ready: { ...g.ready },
      result: g.result ? { rates: g.result.rates, rewards: g.result.rewards } : undefined,
    };
  }
  const st = g.st;
  return {
    kind: 'battle', stage: room.stage, sub: g.sub, round: st.round, rounds: st.rounds, awakened: st.round > st.rounds, over: st.over,
    win: g.result ? g.result.win : undefined,
    enemy: {
      attr: st.enemy.attr, ...G.ENEMIES[st.enemy.attr], hp: st.enemy.hp, maxHp: st.enemy.maxHp, buff: st.enemyBuff > 0 ? st.enemyBuff : undefined,
      known: st.enemyKnown, cond: st.enemyCond, condText: G.battleCondText(st), condMet: G.battleCondMet(st),
      enraged: st.enemy.hp < st.enemy.maxHp * G.BATTLE.enemyUltHp,
      ult: { cond: st.enemyCond, text: G.battleCondText(st), met: G.battleCondMet(st), attacked: st.team.filter((id) => st.attacked[id]).length, total: st.team.length, best: st.maxRound, thr: G.battleBurst(st.team.length), charging: st.team.filter((id) => st.hp[id] > 0 && st.charge[id] > 0).length },
    },
    sabCmd: st.sabCmd,
    allies: st.team.map((id) => {
      const c = g.cmds[id];
      return {
        id, attr: st.attr[id], hp: st.hp[id], alive: st.hp[id] > 0, charge: st.charge[id], charged: st.charged[id], need: st.needFree[id] ? null : st.need[id], free: !!st.needFree[id],
        dealt: st.dealt[id], revealed: !!st.revealed[id], fx: { burn: st.fx[id].burn, blind: st.fx[id].blind, weak: st.fx[id].weak },
        cmd: c ? { cmd: c.cmd, target: c.target, amount: c.amount, soft: !!c.soft, sab: !!c.sab, spend: c.spend } : null,
      };
    }),
    logs: g.logs, // 一人ひとりの本当のダメージ入り
    cmdsLog: g.godCmds, // ラウンドごとの全員のコマンド(手加減・妨害の有無つき)
  };
}

function specView(room, sid) {
  const view = viewFor(room, sid);
  const inGame = room.phase !== 'lobby';
  view.spectator = true;
  view.chat = null;
  view.play = null;
  view.delivered = room.total; // 霧で伏せられたぶんも含めた本当の累計
  view.deliveredVeiled = false;
  view.reserveView = inGame && room.mode === 'advanced' ? room.reserveTotal : null;
  view.history = room.history; // 納品の内訳・地雷・ダメージも含む完全な記録
  const roles = {}; const jobs = {};
  for (const id of room.order) { const p = room.players.get(id); roles[id] = inGame ? p.role : null; jobs[id] = inGame ? p.job : null; }
  const now = Date.now();
  view.god = inGame ? {
    roles, jobs,
    plan: room.plan ? room.plan.tasks.map((t, i) => ({ turn: i + 1, name: t.name, emoji: t.emoji, need: room.plan.needs[i], battle: !!(room.plan.battles && room.plan.battles[i]) })) : [],
    votes: room.phase === 'vote' || room.phase === 'voteResult' ? { ...room.votes } : {},
    rewards: room.stage === 'deliver' ? { ...room.rewards } : {},
    deliveries: { ...room.deliveries }, reserves: { ...room.reserves },
    veilOn: room.veil, swapOn: room.swapOn, seerUsed: room.seerUsed, hiddenSum: room.hiddenSum,
    jobLogs: Object.fromEntries(room.order.filter((id) => room.players.get(id).job).map((id) => [id, room.players.get(id).log])),
    uses: Object.fromEntries(room.order.filter((id) => room.players.get(id).job).map((id) => [id, room.players.get(id).usesLeft])),
    swaps: room.swapLog,
    game: godGame(room),
    chat: room.chat.slice(-CHAT.show).map((m) => ({ n: m.n, id: m.id, text: m.text, turn: m.turn })),
    pairChat: room.pairChat.filter((m) => m.until > now).map((m) => ({ n: m.n, id: m.id, text: m.text })),
  } : null;
  if (room.phase === 'end') view.final = { ...room.final, roles, jobs, history: room.history, swaps: room.swapLog };
  return view;
}

function broadcast(room) {
  for (const id of room.order) {
    const p = room.players.get(id);
    if (p.connected && p.sid) io.to(p.sid).emit('state', viewFor(room, id));
  }
  for (const sp of room.spectators.values()) {
    if (sp.connected && sp.sid) io.to(sp.sid).emit('state', specView(room, sp.id));
  }
  if (opts.onChange) { try { opts.onChange(room); } catch (e) { /* 保存の失敗でゲームを止めない */ } }
}

/* ---------- 保存・復元(ブラウザ版: ホストが画面を再読み込みしても、部屋を続けられるように) ---------- */

// Map / Set を含む部屋の状態を、文字列にする(タイマーは含めない)
function snapshot() {
  return JSON.stringify([...rooms.values()], (k, v) => {
    if (k === 'timer') return undefined;
    if (v instanceof Map) return { __t: 'M', v: [...v] };
    if (v instanceof Set) return { __t: 'S', v: [...v] };
    return v;
  });
}
// snapshot() の文字列から部屋を戻す。全員「つながっていない」状態から始め、タイマーも張り直す(戻れる猶予として15秒以上)
function restore(str) {
  const list = JSON.parse(str, (k, v) => (v && v.__t === 'M' ? new Map(v.v) : v && v.__t === 'S' ? new Set(v.v) : v));
  for (const room of list) {
    for (const p of room.players.values()) { p.connected = false; p.sid = null; }
    for (const sp of room.spectators.values()) { sp.connected = false; sp.sid = null; }
    room.touched = Date.now();
    room.timer = null;
    if (room.deadline) {
      room.deadline = Math.max(room.deadline, Date.now() + 15000);
      const phase = room.phase;
      room.timer = setTimeout(() => onTimeout(room, phase), room.deadline - Date.now());
    }
    rooms.set(room.code, room);
  }
  return list.map((r) => r.code);
}

/* ---------- フェーズ進行 ---------- */

function setPhase(room, phase, sec) {
  clearTimeout(room.timer);
  room.phase = phase;
  room.deadline = sec ? Date.now() + sec * 1000 : 0;
  if (sec) room.timer = setTimeout(() => onTimeout(room, phase), sec * 1000);
  broadcast(room);
}

function onTimeout(room, phase) {
  if (room.phase !== phase) return;
  switch (phase) {
    case 'discuss': return autoPropose(room);
    case 'vote': return resolveVote(room);
    case 'voteResult': return afterVoteResult(room);
    case 'collect': return onCollectTimeout(room);
    case 'result': return afterResult(room);
    default:
  }
}

function startGame(room) {
  const n = room.order.length;
  const wolfNum = G.resolveWolves(n, room.settings.wolves);
  const wolves = new Set(G.shuffle(room.order).slice(0, wolfNum));
  for (const id of room.order) {
    const p = room.players.get(id);
    p.role = wolves.has(id) ? 'wolf' : 'citizen';
    p.job = null; p.usesLeft = 0; p.log = [];
  }
  room.turns = room.settings.turns;
  room.mode = G.MODES[room.settings.mode] ? room.settings.mode : 'beginner';
  // 人狼側の役職(霧使い・すり替え屋)。確率で入り、それぞれ別の人狼になる(人狼が1人なら片方だけ)
  {
    const st = room.settings;
    const jobs = G.shuffle(['veil', 'swap'].filter((j) => Math.random() * 100 < st[`${j}Chance`]));
    const wl = G.shuffle([...wolves]);
    jobs.slice(0, wl.length).forEach((job, i) => {
      const p = room.players.get(wl[i]);
      p.job = job;
      p.usesLeft = st[`${job}Uses`];
    });
  }
  // 村人側の役職(倉庫管理者は上級者モードのみ・占い師)。市民の中からランダムに選ぶ。合計は市民の人数 − 1 まで
  {
    const st = room.settings;
    let slots = G.maxVillageRoles(n, wolfNum);
    const pool = G.shuffle(room.order.filter((x) => !wolves.has(x)));
    for (const job of ['keeper', 'seer']) {
      if (job === 'keeper' && room.mode !== 'advanced') continue;
      const k = Math.min(st[`${job}Count`], G.MAX_ROLE_COUNT, slots);
      for (let i = 0; i < k; i++) {
        const p = room.players.get(pool.pop());
        p.job = job;
        p.usesLeft = st[`${job}Uses`];
      }
      slots -= k;
    }
  }
  room.plan = G.rollPlan(n, room.turns, room.mode, Math.random, { wolves: wolfNum });
  room.turn = 0;
  room.chat = [];
  room.pairChat = [];
  room.history = [];
  room.total = 0;
  room.reserveTotal = 0;
  room.final = null;
  room.hiddenSum = 0;
  room.swapLog = [];
  room.leaderIdx = Math.floor(Math.random() * n);
  nextTurn(room);
}

function nextTurn(room) {
  room.turn += 1;
  if (room.turn > room.turns) return endGame(room);
  room.attempt = 1;
  room.volunteers = new Set();
  room.proposal = [];
  room.forced = false;
  room.votes = {};
  room.lastVotes = null;
  room.approved = null;
  room.stage = null;
  room.game = null;
  room.rewards = {};
  room.deliveries = {};
  room.reserves = {};
  room.veil = false; // そのターンに霧使いが濃霧を使ったか
  room.swapOn = false; // すり替え屋のON/OFF(投票のたびにOFFに戻る)
  room.seerUsed = false; // そのターンに占い師が占ったか
  setPhase(room, 'discuss', room.settings.discussSec);
}

function rotateLeader(room) {
  room.leaderIdx = (room.leaderIdx + 1) % room.order.length;
}

function autoPropose(room) {
  const need = needNow(room);
  const vols = G.shuffle([...room.volunteers].filter((id) => room.players.has(id)));
  const rest = G.shuffle(room.order.filter((id) => !room.volunteers.has(id)));
  rest.sort((a, b) => Number(room.players.get(b).connected) - Number(room.players.get(a).connected));
  propose(room, vols.concat(rest).slice(0, need));
}

function propose(room, ids) {
  room.proposal = ids;
  room.votes = {};
  if (room.attempt >= MAX_ATTEMPT) { // 3回目は投票なしで確定
    room.forced = true;
    room.approved = true;
    return startCollect(room);
  }
  setPhase(room, 'vote', T.vote);
}

function checkVoteDone(room) {
  if (room.phase !== 'vote') return;
  const connected = room.order.filter((id) => room.players.get(id).connected);
  if (connected.every((id) => id in room.votes)) resolveVote(room);
}

function resolveVote(room) {
  const lv = {};
  let yes = 0;
  for (const id of room.order) {
    const v = room.votes[id];
    lv[id] = v === undefined ? null : v;
    if (v !== false) yes += 1; // 未投票は賛成扱い
  }
  room.lastVotes = lv;
  const n = room.order.length;
  room.approved = yes * 2 > n;
  // すり替え屋: 賛成と反対の票数を入れ替えて集計する(投票の中身は公開のまま。使われたことは終了後にだけ公開)
  const swapper = [...room.players.values()].find((p) => p.job === 'swap');
  let swapped = false;
  if (room.swapOn && swapper && hasUse(swapper)) {
    swapped = true;
    useOne(swapper);
    room.approved = (n - yes) * 2 > n;
    room.swapLog.push({ turn: room.turn, attempt: room.attempt, yes, no: n - yes, approved: room.approved });
  }
  room.tally = swapped ? { yes: n - yes, no: yes } : { yes, no: n - yes }; // 公開される票数(すり替えられていれば入れ替わっている)
  room.swapOn = false;
  setPhase(room, 'voteResult', T.voteResult);
}

function afterVoteResult(room) {
  if (room.approved) return startCollect(room);
  rotateLeader(room);
  room.attempt += 1;
  room.volunteers = new Set();
  room.proposal = [];
  room.votes = {};
  room.approved = null;
  setPhase(room, 'discuss', room.settings.discussSec);
}

// タスク開始: 探索する人数に応じてミニゲームを始める(遊ぶ段階 → 納品の段階)
function startCollect(room) {
  room.pairChat = []; // 数字ゲーム専用チャットは、ゲームごとに空から始める
  room.rewards = {};
  room.deliveries = {};
  room.reserves = {};
  room.stage = 'play';
  const task = room.plan.tasks[room.turn - 1];
  const kind = task && task.battle ? 'battle' : G.playKind(room.proposal.length);
  if (kind === 'battle') {
    room.game = { kind, sub: 'command', st: G.battleInit(room.proposal, Math.random, room.proposal.filter((id) => room.players.get(id).role === 'wolf')), cmds: {}, soft: {}, logs: [], godCmds: [] };
    setPhase(room, 'collect', T.battleCmd);
  } else if (kind === 'mine') {
    room.game = { kind, ...G.mineBoard(room.proposal.length), picks: {}, extras: {} };
    setPhase(room, 'collect', T.mine);
  } else {
    room.game = {
      kind, round: 1, sub: 'ready', ready: {},
      seqs: Array.from({ length: G.MEMORY.rounds }, () => G.memorySeq()),
      entries: Array.from({ length: G.MEMORY.rounds }, () => ({})),
      drafts: Array.from({ length: G.MEMORY.rounds }, () => ({})),
    };
    setPhase(room, 'collect', T.memReady);
  }
  checkCollectDone(room);
}

const connectedTeam = (room) => room.proposal.filter((id) => room.players.get(id)?.connected);

// 記憶ゲームで、そのラウンドに自分が見る側(0=前半 / 1=後半)
function memPart(room, pid) {
  const idx = room.proposal.indexOf(pid);
  return (idx + room.game.round - 1) % 2;
}

// ミニゲームの自分の分が終わっているか
function playDone(room, id) {
  const g = room.game;
  if (!g) return false;
  if (room.stage === 'deliver') return true;
  if (g.kind === 'battle') return g.sub === 'command' && (g.cmds[id] !== undefined || !G.battleCanUse(g.st, id, 'attack')); // コマンドを選んだか(ログの時間中は全員「未」)
  if (g.kind === 'mine') return mineDone(g, id);
  if (g.sub === 'ready') return !!g.ready[id];
  return id in g.entries[g.round - 1];
}

// 地雷ゲームで引かれたタイル(1枚目も+1カードの追加ぶんも)
const takenTiles = (g) => [...Object.values(g.picks), ...Object.values(g.extras)];
// 地雷ゲームの自分の分が終わっているか(+1カードを引いたら、追加の1枚まで引いて終わり)
const mineDone = (g, id) => g.picks[id] !== undefined && (g.picks[id] !== g.plus || g.extras[id] !== undefined);

// ミニゲームの画面用の情報(チームの人にだけ送る。他人の数字や数列は送らない)
// バトルのログを送るとき、味方一人ひとりのダメージ数は消す(hit=ダメージが出たか)。ラウンドの合計 total だけが見える
function viewLog(l) {
  return { ...l, acts: l.acts.map((a) => { const { dmg, ...r } = a; return { ...r, hit: dmg > 0 }; }) };
}

function playView(room, pid) {
  const g = room.game;
  if (!g) return null;
  const me = room.players.get(pid);
  if (g.kind === 'battle') {
    const st = g.st;
    const spectator = !room.proposal.includes(pid); // 待機中の観戦者
    return {
      spectator: spectator || undefined,
      kind: 'battle', stage: room.stage, sub: g.sub, round: st.round, rounds: st.rounds, awakened: st.round > st.rounds,
      // 敵の属性(と名前)は、誰かがスキルを使うまで伏せられる
      enemy: {
        attr: st.enemyKnown ? st.enemy.attr : null, hp: st.enemy.hp, maxHp: st.enemy.maxHp, ...(st.enemyKnown ? G.ENEMIES[st.enemy.attr] : { emoji: '❓', name: '正体不明の魔物' }),
        buff: st.enemyBuff > 0 ? st.enemyBuff : undefined, // 人狼の妨害で敵が強化されている残りラウンド(全員に見える。誰がやったかは分からない)
        enraged: st.enemy.hp < st.enemy.maxHp * G.BATTLE.enemyUltHp, // 体力が半分を切ると、敵が奥義を使えるようになる(条件を満たしたとき)。これは全員に見える
        // 敵の奥義の発動条件とその達成状況は、人狼と観戦者(待機中の人)にだけ見える
        ult: spectator || me.role === 'wolf'
          ? { cond: st.enemyCond, text: G.battleCondText(st), met: G.battleCondMet(st), attacked: st.team.filter((id) => st.attacked[id]).length, total: st.team.length, best: st.maxRound, thr: G.battleBurst(st.team.length), charging: st.team.filter((id) => st.hp[id] > 0 && st.charge[id] > 0).length }
          : undefined,
      },
      // 味方の属性は、本人かスキルを使った人のぶんだけ見える。HPはチーム全員に見える。ポイントは、本人には「いま持っている数」、ほかの人には「ためた累計」(奥義で使っても減らない)だけが見え、奥義の消費量は誰にも分からない。奥義に必要なポイントは本人だけ
      allies: st.team.map((id) => ({ id, attr: id === pid || st.revealed[id] ? st.attr[id] : null, hp: st.hp[id], alive: st.hp[id] > 0, charged: st.charged[id], charge: id === pid ? st.charge[id] : undefined, fx: { burn: st.fx[id].burn, blind: st.fx[id].blind, weak: st.fx[id].weak } })), // 状態異常(残りラウンド)は全員に見える
      me: spectator ? null : { need: st.needFree[pid] ? null : st.need[pid], free: st.needFree[pid] ? true : undefined, ultMult: st.needFree[pid] ? null : G.ultMult(st.need[pid]), alive: st.hp[pid] > 0, cmd: g.cmds[pid] ? g.cmds[pid].cmd : undefined, target: g.cmds[pid] ? g.cmds[pid].target : undefined, amount: g.cmds[pid] ? g.cmds[pid].amount : undefined, soft: me.role === 'wolf' ? !!(g.cmds[pid] && g.cmds[pid].soft) : undefined, sab: me.role === 'wolf' ? !!(g.cmds[pid] && g.cmds[pid].sab) : undefined, sabCmd: me.role === 'wolf' ? st.sabCmd : undefined, spend: g.cmds[pid] ? g.cmds[pid].spend : undefined },
      logs: g.logs.map(viewLog), // 戦闘中は、一人ひとりのダメージ数を伏せる(合計だけ見える。個別の与ダメージは終了画面で公開)
      win: room.stage === 'deliver' ? g.result.win : undefined,
      over: st.over,
    };
  }
  if (g.kind === 'mine') {
    const mine = g.picks[pid];
    const v = {
      kind: 'mine', stage: room.stage, size: g.size, cols: g.cols,
      taken: takenTiles(g), // 誰かが引いたタイル(誰が引いたかは送らない)
      myTile: mine, myValue: mine !== undefined ? g.values[mine] : undefined, // 地雷かどうかは引いた本人にも教えない
      // +1カードは、引いた本人にだけ見える
      plus: mine !== undefined && mine === g.plus,
      myExtra: g.extras[pid], myExtraValue: g.extras[pid] !== undefined ? g.values[g.extras[pid]] : undefined,
      hit: room.stage === 'deliver' ? !!g.result.hit : undefined,
      board: null,
    };
    // 人狼は、チームに入ると地雷の位置と全タイルの数字が見える
    if (me.role === 'wolf' && room.stage === 'play') v.board = { hint: g.hint, values: g.values }; // 地雷の位置は「この3枚のどれか」までしか分からない
    return v;
  }
  const v = { kind: 'memory', stage: room.stage, round: g.round, rounds: G.MEMORY.rounds, sub: g.sub, len: G.MEMORY.half * 2, half: G.MEMORY.half };
  if (room.stage === 'play') {
    const part = memPart(room, pid);
    v.part = part; // 0=前半 / 1=後半
    v.ready = !!g.ready[pid];
    v.submitted = pid in g.entries[g.round - 1];
    if (g.sub === 'show') v.digits = g.seqs[g.round - 1].slice(part * G.MEMORY.half, part * G.MEMORY.half + G.MEMORY.half);
  }
  return v;
}

function checkCollectDone(room) {
  if (room.phase !== 'collect') return;
  const live = connectedTeam(room);
  if (room.stage === 'deliver') {
    if (live.every((id) => id in room.deliveries)) resolveCollect(room);
    return;
  }
  const g = room.game;
  if (!g) return;
  if (g.kind === 'battle') {
    if (g.sub === 'command' && live.every((id) => playDone(room, id))) resolveBattleRound(room);
  } else if (g.kind === 'mine') {
    if (live.every((id) => mineDone(g, id))) finishPlay(room);
  } else if (g.sub === 'ready') {
    if (live.every((id) => g.ready[id])) startShow(room);
  } else if (g.sub === 'enter') {
    if (live.every((id) => id in g.entries[g.round - 1])) endRound(room);
  }
}

function onCollectTimeout(room) {
  if (room.stage === 'deliver') return resolveCollect(room);
  const g = room.game;
  if (g.kind === 'battle') return g.sub === 'command' ? resolveBattleRound(room) : nextBattleRound(room);
  if (g.kind === 'mine') return finishPlay(room);
  if (g.sub === 'ready') return startShow(room);
  if (g.sub === 'show') return startEnter(room);
  return endRound(room);
}

// バトル: 全員のコマンドをまとめて処理し、結果(ログ)を見せる段階へ。コマンド未入力の人は「たたかう」になる。
function resolveBattleRound(room) {
  const g = room.game;
  g.godCmds.push(JSON.parse(JSON.stringify(g.cmds))); // 神視点用: そのラウンドの全員のコマンド(手加減・妨害つき)
  g.logs.push(G.battleRound(g.st, g.cmds));
  g.cmds = {};
  g.sub = 'log';
  setPhase(room, 'collect', T.battleLog);
}

// ログを見せ終えたら、次のラウンドへ(決着がついていれば報酬を決める)
function nextBattleRound(room) {
  const g = room.game;
  if (g.st.over) return finishPlay(room);
  g.sub = 'command';
  setPhase(room, 'collect', T.battleCmd);
  checkCollectDone(room);
}

function startShow(room) {
  room.game.sub = 'show';
  setPhase(room, 'collect', T.memShow);
}

function startEnter(room) {
  room.game.sub = 'enter';
  setPhase(room, 'collect', T.memEnter);
  checkCollectDone(room);
}

function endRound(room) {
  const g = room.game;
  // 確定していない人は、入力途中の数字をそのまま使う
  for (const [id, digits] of Object.entries(g.drafts[g.round - 1])) if (!(id in g.entries[g.round - 1])) g.entries[g.round - 1][id] = digits;
  if (g.round >= G.MEMORY.rounds) return finishPlay(room);
  g.round += 1;
  g.sub = 'ready';
  g.ready = {};
  setPhase(room, 'collect', T.memReady);
  checkCollectDone(room);
}

// 遊ぶ段階を終えて、全員の報酬を確定し、納品の段階へ進む
function finishPlay(room) {
  room.pairChat = []; // ゲームが終わったら、数字ゲーム専用チャットは消える
  const g = room.game;
  if (g.kind === 'battle') {
    g.result = G.battleRewards(g.st);
  } else if (g.kind === 'mine') {
    // 時間切れ・切断で引いていない人は、まだ誰も引いていないタイルからランダムに引く
    const free = G.shuffle([...Array(g.size).keys()].filter((i) => !takenTiles(g).includes(i)));
    for (const id of room.proposal) {
      if (g.picks[id] === undefined) g.picks[id] = free.pop();
      if (g.picks[id] === g.plus && g.extras[id] === undefined) g.extras[id] = free.pop();
    }
    g.result = G.mineRewards(room.proposal, { size: g.size, mine: g.mine, plus: g.plus, values: g.values }, g.picks, g.extras);
  } else {
    g.result = G.memoryRewards(room.proposal, g.seqs, g.entries);
  }
  room.rewards = { ...g.result.rewards };
  room.stage = 'deliver';
  setPhase(room, 'collect', T.deliver);
  checkCollectDone(room);
}

function resolveCollect(room) {
  const need = needNow(room);
  // 未提出は、標準の納品数(初心者は全部、上級者は標準の配分)にする
  const r = G.resolveCollect(room.proposal, room.rewards, room.deliveries, room.mode, room.reserves);
  const total = r.total;
  room.total += total;
  if (room.veil) { // 濃霧: そのターンの納品数は伏せられ、公開される累計には含まれない(使った本人にだけ本当の数を教える)
    room.hiddenSum += total;
    const v = [...room.players.values()].find((p) => p.job === 'veil');
    if (v) v.log.push({ turn: room.turn, total });
  }
  room.reserveTotal += r.reservedTotal;
  const g = room.game;
  room.history.push({
    turn: room.turn, task: room.plan.tasks[room.turn - 1], need, team: [...room.proposal],
    attempts: room.attempt, forced: room.forced,
    amounts: r.amounts, drawn: r.drawn, skimmed: r.skimmed, reserved: r.reserved, discarded: r.discarded, total,
    kind: g.kind,
    mineHit: g.kind === 'mine' ? g.result.hit : null,
    hitBy: g.kind === 'mine' ? g.result.hitBy : null,   // 地雷を引いた人(終了後にだけ公開)
    tiles: g.kind === 'mine' ? g.result.tiles : null,   // それぞれが引いたタイルの数字(地雷の影響を受ける前)
    battleWin: g.kind === 'battle' ? g.result.win : null,
    downs: g.kind === 'battle' ? g.result.downs : null, // 戦闘不能になった人(終了後にだけ公開)
    koFactor: g.kind === 'battle' ? g.result.koFactor : null, // 戦闘不能者の数で全員にかかった報酬の倍率
    dealt: g.kind === 'battle' ? g.result.dealt : null, // バトルで与えたダメージ(終了後にだけ公開)
    plusBy: g.kind === 'mine' ? g.result.plusBy : null, // +1カードを引いた人(終了後にだけ公開)
    rates: g.kind === 'memory' ? g.result.rates : null, // 記憶ゲームの成功率(終了後にだけ公開)
    veiled: room.veil, // 濃霧で伏せられたターン
  });
  room.stage = null;
  setPhase(room, 'result', T.result);
}

function afterResult(room) {
  rotateLeader(room);
  nextTurn(room);
}

function endGame(room) {
  room.turn = room.turns;
  const j = G.judge(room.plan, room.total, room.reserveTotal);
  room.final = {
    mode: room.mode,
    total: room.total,
    reserveTotal: room.reserveTotal,
    target: room.plan.target,
    cap: room.plan.cap !== undefined ? room.plan.cap : null,
    reserveTarget: room.plan.reserveTarget !== undefined ? room.plan.reserveTarget : null,
    winner: j.winner,
    reasons: j.reasons,
  };
  setPhase(room, 'end', 0);
}

/* ---------- ソケット ---------- */

io.on('connection', (socket) => {
  const ctx = () => {
    const room = rooms.get(socket.data?.code);
    const p = room && room.players.get(socket.data.pid);
    return room && p ? { room, p } : null;
  };

  socket.on('create', (d, cb) => {
    const name = cleanName(d && d.name);
    if (!name) return reply(cb, { ok: false, error: '名前を入力してください' });
    const room = newRoom(d && d.code);
    const p = addPlayer(room, name);
    attach(room, p, socket);
    broadcast(room);
    reply(cb, { ok: true, code: room.code, pid: p.id });
  });

  socket.on('join', (d, cb) => {
    const room = rooms.get(String((d && d.code) || '').trim());
    const name = cleanName(d && d.name);
    if (!name) return reply(cb, { ok: false, error: '名前を入力してください' });
    if (!room) return reply(cb, { ok: false, error: 'ルームが見つかりません' });
    const same = room.order.map((id) => room.players.get(id)).find((p) => p.name === name);
    if (same && !same.connected) { // 切断中の同名プレイヤーは席に復帰
      attach(room, same, socket);
      broadcast(room);
      return reply(cb, { ok: true, code: room.code, pid: same.id });
    }
    const sameSpec = [...room.spectators.values()].find((x) => x.name === name);
    if (sameSpec && !sameSpec.connected) { // 切断中の同名の観戦者は観戦席に復帰
      attachSpec(room, sameSpec, socket);
      broadcast(room);
      return reply(cb, { ok: true, code: room.code, pid: sameSpec.id, spectator: true });
    }
    if (same || sameSpec) return reply(cb, { ok: false, error: 'その名前は既に使われています' });
    if (room.phase !== 'lobby') { // ゲーム中にルームコードで入った人は、観戦(神視点)になる
      if (room.spectators.size >= MAX_SPECTATORS) return reply(cb, { ok: false, error: `観戦席が満員です(最大${MAX_SPECTATORS}人)` });
      const sp = addSpectator(room, name);
      attachSpec(room, sp, socket);
      broadcast(room);
      return reply(cb, { ok: true, code: room.code, pid: sp.id, spectator: true });
    }
    if (room.order.length >= G.MAX_PLAYERS) return reply(cb, { ok: false, error: `満員です(最大${G.MAX_PLAYERS}人)` });
    const p = addPlayer(room, name);
    attach(room, p, socket);
    broadcast(room);
    reply(cb, { ok: true, code: room.code, pid: p.id });
  });

  socket.on('rejoin', (d, cb) => {
    const room = rooms.get(String((d && d.code) || ''));
    const p = room && room.players.get(d.pid);
    const sp = room && !p && room.spectators.get(d.pid);
    if (!room || (!p && !sp)) return reply(cb, { ok: false });
    if (p) attach(room, p, socket); else attachSpec(room, sp, socket);
    broadcast(room);
    reply(cb, { ok: true, spectator: !p });
  });

  socket.on('settings', (d) => {
    const c = ctx();
    if (!c || c.room.phase !== 'lobby' || c.room.hostId !== c.p.id || !d) return;
    const s = c.room.settings;
    if (d.turns !== undefined) s.turns = clamp(Math.round(Number(d.turns)) || 6, 4, 8);
    if (d.discussSec !== undefined) s.discussSec = clamp(Math.round(Number(d.discussSec)) || 90, MIN_DISCUSS, 180);
    for (const k of ['keeperCount', 'seerCount']) if (d[k] !== undefined) s[k] = clamp(Math.round(Number(d[k])) || 0, 0, G.MAX_ROLE_COUNT);
    for (const k of ['veilChance', 'swapChance']) if (d[k] !== undefined && G.ROLE_CHANCES.includes(Number(d[k]))) s[k] = Number(d[k]);
    for (const k of ['keeperUses', 'seerUses', 'veilUses', 'swapUses']) if (d[k] !== undefined && G.ROLE_USES.includes(Number(d[k]))) s[k] = Number(d[k]);
    if (d.wolves !== undefined) s.wolves = clamp(Math.round(Number(d.wolves)) || 0, 0, G.MAX_PLAYERS);
    if (typeof d.mode === 'string' && G.MODES[d.mode]) s.mode = d.mode;
    broadcast(c.room);
  });

  socket.on('start', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'lobby' || c.room.hostId !== c.p.id) return;
    if (c.room.order.length < MIN_PLAYERS) return reply(cb, { ok: false, error: `${MIN_PLAYERS}人以上で開始できます` });
    startGame(c.room);
    reply(cb, { ok: true });
  });

  socket.on('volunteer', () => {
    const c = ctx();
    if (!c || c.room.phase !== 'discuss') return;
    const v = c.room.volunteers;
    if (v.has(c.p.id)) v.delete(c.p.id); else v.add(c.p.id);
    broadcast(c.room);
  });

  socket.on('propose', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'discuss' || leaderId(c.room) !== c.p.id) return;
    const ids = Array.isArray(d && d.ids) ? [...new Set(d.ids)] : [];
    const need = needNow(c.room);
    if (ids.length !== need || !ids.every((id) => c.room.players.has(id))) {
      return reply(cb, { ok: false, error: `${need}人を選んでください` });
    }
    propose(c.room, ids);
    reply(cb, { ok: true });
  });

  socket.on('vote', (d) => {
    const c = ctx();
    if (!c || c.room.phase !== 'vote') return;
    c.room.votes[c.p.id] = !!(d && d.approve);
    broadcast(c.room);
    checkVoteDone(c.room);
  });

  // 地雷ゲーム: タイルを1枚引く(1人1回、ほかの人が引いたタイルは選べない)。引いた数字は本人にだけ返る
  socket.on('pick', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'collect' || c.room.stage !== 'play' || !c.room.proposal.includes(c.p.id)) return reply(cb, { ok: false, error: 'いまは使えません' });
    const { room, p } = c;
    const g = room.game;
    if (g.kind !== 'mine') return reply(cb, { ok: false, error: 'いまは地雷ゲームではありません' });
    if (mineDone(g, p.id)) return reply(cb, { ok: false, error: 'もうタイルを引いています' });
    const i = Number(d && d.tile);
    if (!Number.isInteger(i) || i < 0 || i >= g.size) return reply(cb, { ok: false, error: 'タイルを選んでください' });
    if (takenTiles(g).includes(i)) return reply(cb, { ok: false, error: 'そのタイルはもう引かれています' });
    const extra = g.picks[p.id] !== undefined; // +1カードを引いたあとの、追加の1枚
    if (extra) g.extras[p.id] = i; else g.picks[p.id] = i;
    broadcast(room);
    // 地雷だったかどうかは返さない。+1カードだったときだけ、本人に伝える
    reply(cb, { ok: true, value: g.values[i], plus: !extra && i === g.plus });
    checkCollectDone(room);
  });

  // バトル: コマンドを選ぶ(1ラウンド1回、確定後は変更不可)。soft=手加減(人狼だけ。乱数の下位 0.6〜0.9 で攻撃する)
  socket.on('battle', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'collect' || c.room.stage !== 'play' || !c.room.proposal.includes(c.p.id)) return reply(cb, { ok: false, error: 'いまは使えません' });
    const { room, p } = c;
    const g = room.game;
    if (g.kind !== 'battle' || g.sub !== 'command') return reply(cb, { ok: false, error: 'いまはコマンドを選べません' });
    if (g.cmds[p.id] !== undefined) return reply(cb, { ok: false, error: 'このラウンドはもう選んでいます' });
    const cmd = d && d.cmd;
    const target = cmd === 'share' ? d.target : undefined;
    if (!G.battleCanUse(g.st, p.id, cmd, target)) {
      return reply(cb, { ok: false, error: cmd === 'ultimate' ? '奥義のポイントが足りません' : cmd === 'share' ? 'その人にはHPを分けられません(戦闘不能・HPが満タン・自分自身)' : 'そのコマンドは使えません' });
    }
    const amount = cmd === 'share' && Number.isFinite(Number(d.amount)) ? Math.floor(Number(d.amount)) : undefined; // HPを分ける量(範囲は game.js が丸める)
    const spend = cmd === 'ultimate' && p.role === 'wolf' && Number.isFinite(Number(d.spend)) ? Math.floor(Number(d.spend)) : undefined; // 人狼が最初の奥義で使うポイント数
    g.cmds[p.id] = { cmd, target, amount, spend, soft: p.role === 'wolf' && !!(d && d.soft), sab: p.role === 'wolf' && cmd === g.st.sabCmd && !!(d && d.sab) }; // 手加減・妨害は人狼だけ(妨害は、そのバトルの妨害コマンドにだけつけられる)
    broadcast(room);
    reply(cb, { ok: true });
    checkCollectDone(room);
  });

  // チャット(話し合いチャットは全員に残る / 数字ゲーム専用チャットはペアだけで、一定時間で消える)
  socket.on('chat', (d, cb) => {
    const c = ctx();
    if (!c) return reply(cb, { ok: false });
    const { room, p } = c;
    const mode = chatMode(room, p.id);
    if (!mode) return reply(cb, { ok: false, error: 'いまはチャットを使えません' });
    const text = String(d && d.text !== undefined ? d.text : '').replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, mode === 'pair' ? CHAT.pairMax : CHAT.max);
    if (!text) return reply(cb, { ok: false });
    const now = Date.now();
    if (p.lastChat && now - p.lastChat < CHAT.gap) return reply(cb, { ok: false, error: '送信が速すぎます' });
    p.lastChat = now;
    room.chatN += 1;
    if (mode === 'pair') {
      room.pairChat = room.pairChat.filter((m) => m.until > now);
      room.pairChat.push({ n: room.chatN, id: p.id, text, until: now + CHAT.pairLife });
    } else {
      room.chat.push({ n: room.chatN, id: p.id, text, turn: room.phase === 'lobby' ? 0 : room.turn });
      if (room.chat.length > CHAT.keep) room.chat.splice(0, room.chat.length - CHAT.keep);
    }
    room.touched = Date.now();
    broadcast(room);
    reply(cb, { ok: true });
  });

  // 記憶ゲーム: 「見る準備ができた」(全員が押すと数字が表示される)
  socket.on('memReady', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'collect' || c.room.stage !== 'play' || !c.room.proposal.includes(c.p.id)) return reply(cb, { ok: false, error: 'いまは使えません' });
    const g = c.room.game;
    if (g.kind !== 'memory' || g.sub !== 'ready') return reply(cb, { ok: false, error: 'いまは準備の時間ではありません' });
    g.ready[c.p.id] = true;
    broadcast(c.room);
    reply(cb, { ok: true });
    checkCollectDone(c.room);
  });

  // 記憶ゲーム: 数列全体を入力して確定する(確定後は変更不可)
  socket.on('memSubmit', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'collect' || c.room.stage !== 'play' || !c.room.proposal.includes(c.p.id)) return reply(cb, { ok: false, error: 'いまは使えません' });
    const { room, p } = c;
    const g = room.game;
    if (g.kind !== 'memory' || g.sub !== 'enter') return reply(cb, { ok: false, error: 'いまは入力の時間ではありません' });
    const e = g.entries[g.round - 1];
    if (p.id in e) return reply(cb, { ok: false, error: 'もう入力しています' });
    const digits = d && Array.isArray(d.digits) ? d.digits.slice(0, G.MEMORY.half * 2).map((x) => (Number.isInteger(x) && x >= 0 && x <= 9 ? x : -1)) : [];
    if (d && d.draft) { // 入力途中の数字を預かる(時間切れのときは、これがそのまま使われる)
      g.drafts[g.round - 1][p.id] = digits;
      return reply(cb, { ok: true, draft: true });
    }
    e[p.id] = digits;
    broadcast(room);
    reply(cb, { ok: true });
    checkCollectDone(room);
  });

  // 納品数を確定する(報酬の数まで。確定後は変更不可)
  socket.on('deliver', (d, cb) => {
    const c = ctx();
    if (!c || c.room.phase !== 'collect' || c.room.stage !== 'deliver' || !c.room.proposal.includes(c.p.id)) return reply(cb, { ok: false, error: 'いまは使えません' });
    const { room, p } = c;
    if (room.deliveries[p.id] !== undefined) return reply(cb, { ok: false, error: 'もう納品しています' });
    const value = room.rewards[p.id];
    const n = Math.round(Number(d && d.amount));
    room.deliveries[p.id] = Number.isFinite(n) ? clamp(n, 0, value) : value;
    // 上級者モードのみ: 備蓄する数(納品の残りまで)。残りは捨てる。送られなければ残り全部を備蓄する
    if (room.mode === 'advanced') {
      const rv = d && d.reserve !== undefined && d.reserve !== null ? Math.round(Number(d.reserve)) : NaN;
      const rest = value - room.deliveries[p.id];
      // 市民は、納品しなかった分がすべて備蓄になる(納品にも備蓄にも回さない=捨てる、は人狼だけが選べる)
      room.reserves[p.id] = p.role !== 'wolf' ? rest : (Number.isFinite(rv) ? clamp(rv, 0, rest) : rest);
    }
    broadcast(room);
    reply(cb, { ok: true, amount: room.deliveries[p.id], reserve: room.reserves[p.id] });
    checkCollectDone(room);
  });

  // 占い師: 自分が待機中に、いま探索している中に人狼がいるかを知る(1ターンに1回まで)
  socket.on('seer', (d, cb) => {
    const c = ctx();
    if (!c) return;
    const { room, p } = c;
    if (p.job !== 'seer' || room.phase !== 'collect') return reply(cb, { ok: false, error: '使えません' });
    if (room.proposal.includes(p.id)) return reply(cb, { ok: false, error: 'タスクに選ばれているときは占えません' });
    if (room.seerUsed) return reply(cb, { ok: false, error: 'このターンはもう占いました' });
    if (!hasUse(p)) return reply(cb, { ok: false, error: '使える回数を使い切りました' });
    const found = room.proposal.some((id) => room.players.get(id).role === 'wolf');
    room.seerUsed = true;
    useOne(p);
    p.log.push({ turn: room.turn, team: [...room.proposal], found });
    broadcast(room);
    reply(cb, { ok: true, found, left: p.usesLeft });
  });

  // 霧使い(人狼): そのターンの納品数を完全に伏せる(タスクの間に使う。1ターンに1回まで)
  socket.on('veil', (d, cb) => {
    const c = ctx();
    if (!c) return;
    const { room, p } = c;
    if (p.job !== 'veil' || room.phase !== 'collect') return reply(cb, { ok: false, error: '使えません' });
    if (room.veil) return reply(cb, { ok: false, error: 'このターンはもう使いました' });
    if (!hasUse(p)) return reply(cb, { ok: false, error: '使える回数を使い切りました' });
    room.veil = true;
    useOne(p);
    broadcast(room);
    reply(cb, { ok: true, left: p.usesLeft });
  });

  // すり替え屋(人狼): 投票の間に、賛成と反対の票数の入れ替えをON/OFFする(集計されたときに回数を1つ使う)
  socket.on('swap', (d, cb) => {
    const c = ctx();
    if (!c) return;
    const { room, p } = c;
    if (p.job !== 'swap' || room.phase !== 'vote') return reply(cb, { ok: false, error: '使えません' });
    const on = !!(d && d.on);
    if (on && !hasUse(p)) return reply(cb, { ok: false, error: '使える回数を使い切りました' });
    room.swapOn = on;
    broadcast(room);
    reply(cb, { ok: true, on });
  });

  // 倉庫管理者: ターンの始め(話し合い中)に、倉庫の総数を確認する(上級者モード。残りターンが少なくなると確認できない)
  socket.on('check', (d, cb) => {
    const c = ctx();
    if (!c) return;
    const { room, p } = c;
    if (room.mode !== 'advanced' || p.job !== 'keeper' || room.phase !== 'discuss') return reply(cb, { ok: false, error: '確認できません(ターンの始めの話し合い中だけです)' });
    if (!G.canCheck(room.turn, room.turns)) return reply(cb, { ok: false, error: '残りターンが少ないため、もう確認できません' });
    if (!hasUse(p)) return reply(cb, { ok: false, error: '確認できる回数を使い切りました' });
    useOne(p);
    const res = { turn: room.turn, reserve: room.reserveTotal, delivered: room.total };
    p.log.push(res);
    broadcast(room);
    reply(cb, { ok: true, ...res, left: p.usesLeft });
  });

  // ホストが途中でゲームを終える。そこまでの記録と人狼の正体を公開して終了画面へ(勝敗は付けない)
  socket.on('abort', () => {
    const c = ctx();

        <p class="sub">人狼の人数(自動なら人数に応じて決まります。目標は変わらないので、増やすほど市民が不利になります)</p>`;
    const roles = `<h2>🎭 役職${host ? '' : '(ホストのみ変更可)'}</h2>
        <p class="sub">役職は、本人にだけ表示されます。使える回数は役職ごとに決められます(「無制限」もあります)。</p>
        <h3 class="side citizen">🧑‍🌾 村人側(人数は合計で 市民の人数−1 まで。いま最大${pv.maxVillageRoles}人)</h3>
        <div class="row">
          <select data-act="set" data-k="keeperCount" ${dis}>${cntOpts(s.keeperCount)}</select>
          <select data-act="set" data-k="keeperUses" ${dis}>${useOpts(s.keeperUses)}</select>
        </div>
        <p class="sub">📦 倉庫管理者の人数 / 確認できる回数。<b>上級者モードのみ</b>。ターンの始め(話し合い中)に、倉庫の総数(備蓄の合計と、実際の納品の合計)を確認できます。残り${KEEPER_LAST}ターンになると確認できません。${s.mode === 'advanced' ? '' : '(いまは初心者モードなので入りません)'}</p>
        <div class="row">
          <select data-act="set" data-k="seerCount" ${dis}>${cntOpts(s.seerCount)}</select>
          <select data-act="set" data-k="seerUses" ${dis}>${useOpts(s.seerUses)}</select>
        </div>
        <p class="sub">🔮 占い師の人数 / 1ゲーム中に占える回数。自分が待機中のターンの、タスクをしている間に、いま探索している中に人狼がいるかが分かります(人数は分かりません)。同じターンに同じ探索メンバーを何度占っても結果は同じなので、1ターンに1回までです。</p>
        <h3 class="side wolf">🐺 人狼側(別々の人狼に入ります。人狼が1人のときは、どちらか一方だけ)</h3>
        <div class="row">
          <select data-act="set" data-k="veilChance" ${dis}>${chanceOpts(s.veilChance)}</select>
          <select data-act="set" data-k="veilUses" ${dis}>${useOpts(s.veilUses)}</select>
        </div>
        <p class="sub">🌫️ 霧使いが入る確率 / 使える回数。タスクの間に濃霧を使うと、そのターンの納品数が完全に伏せられます(合計が発表されず、納品の累計にも含まれません)。使った本人にだけ本当の数が見えます。</p>
        <div class="row">
          <select data-act="set" data-k="swapChance" ${dis}>${chanceOpts(s.swapChance)}</select>
          <select data-act="set" data-k="swapUses" ${dis}>${useOpts(s.swapUses)}</select>
        </div>
        <p class="sub">🔄 すり替え屋が入る確率 / 使える回数。投票の間に使うと、賛成と反対の票数が入れ替わって集計されます(3回目の強制確定では使えません)。</p>`;
    const url = `${location.origin}${location.pathname}?room=${S.code}`;
    const lack = S.n < S.minPlayers;
    app.innerHTML = `
      ${brand()}
      <div class="card stack">
        <p class="sub center">ルームコード(友達に伝える)</p>
        <div class="code">${S.code}</div>
        <button class="btn small" data-act="copy" data-url="${esc(url)}">招待リンクをコピー</button>
        ${window.TWNet && host ? '<p class="sub">🖥️ このゲームは<b>あなたの端末がサーバー役</b>です。ゲーム中はこの画面を閉じたり、別のアプリに切り替えたりしないでください(PCでの利用がおすすめ)。うっかり再読み込みしても、部屋は自動で復元されます。</p>' : ''}
      </div>
      <div class="card stack">
        <h2>参加者 ${S.n}/${S.maxPlayers}</h2>
        <div class="chips">${S.players.map((p) => `<span class="chip ${p.id === S.me.id ? 'me' : ''}">${p.host ? '👑' : ''}${p.connected ? '' : '🔌'} ${esc(p.name)}</span>`).join('')}</div>
        <p class="sub">この人数だと 人狼 ${pv.wolves}人 / 毎ターンの必要人数 ${pv.need[0]}〜${pv.need[1]}人</p>
      </div>
      <div class="card stack">
        ${tabs}
        ${lobbyTab === 'roles' ? roles : basic}
      </div>
      ${host
        ? `<button class="btn primary" data-act="start" ${lack ? 'disabled' : ''}>${lack ? `あと${S.minPlayers - S.n}人で開始できます` : 'ゲーム開始'}</button>`
        : '<p class="sub center">ホストの開始を待っています…</p>'}
      <button class="btn small" data-act="leave">退出</button>`;
  }

  // 目標ゲージ。from〜to が目標の範囲(緑)。to が無ければ「from 以上」
  function gauge(v, max, from, to) {
    const pct = (x) => Math.max(0, Math.min(100, (x / max) * 100));
    const zone = `<span class="zone ${to != null ? 'capped' : ''}" style="left:${pct(from)}%;width:${(to != null ? pct(to) : 100) - pct(from)}%"></span>`;
    return `<div class="gauge">${zone}<span class="fill ${to != null && v > to ? 'over' : ''}" style="width:${pct(v)}%"></span></div>`;
  }

  // d = 納品の累計、r = 備蓄の累計(非公開の間は undefined)
  function goalBlock(d, r, wolfView) {
    const vq = S.deliveredVeiled && !S.final ? '<small class="sabnote">+ 霧で伏せられたぶん</small>' : '';
    if (S.mode === 'advanced') {
      const hidden = r === undefined || r === null;
      return `<div class="goal">
        <div><div class="gl"><span>納品 <b>${d}</b>${vq ? ' ' + vq : ''}</span><span>目標 ${S.target}〜${S.cap}(上限)</span></div>${gauge(d, S.cap * 1.12, S.target, S.cap)}</div>
        <div><div class="gl"><span>備蓄 <b>${hidden ? '?' : r}</b></span><span>目標 ${S.reserveTarget}以上${hidden ? '(最後まで非公開)' : (wolfView ? '(人狼にだけ見えています)' : '')}</span></div>
          ${hidden ? '<div class="gauge hidden"></div>' : gauge(r, S.reserveTarget * 1.25, S.reserveTarget, null)}</div>
      </div>`;
    }
    return `<div class="goal"><div><div class="gl"><span>倉庫 <b>${d}</b>${vq ? ' ' + vq : ''}</span><span>目標 ${S.target}〜${S.cap}(上限)</span></div>${gauge(d, S.cap * 1.12, S.target, S.cap)}</div></div>`;
  }

  function roleGoal(wolf) {
    if (S.mode === 'advanced') {
      return wolf
        ? `次のどれかになれば勝ちです。納品が目標(${S.target})未満/納品が上限(${S.cap})超過/備蓄が目標(${S.reserveTarget})未満。0納品なら納品が足りず、全部納品なら備蓄が減り、納品しすぎれば溢れます。市民に気づかれないように。`
        : `納品の合計を${S.target}以上・${S.cap}以下に収め、備蓄の合計も${S.reserveTarget}以上にしましょう。納品しすぎても溢れて負けです。納品と備蓄の振り分けを議論でそろえ、人狼を見抜きます。`;
    }
    return wolf
      ? `納品の合計を、目標(${S.target})未満か上限(${S.cap})超過にすれば勝ちです。少なすぎても多すぎてもOK。市民に気づかれないように。`
      : `納品の合計を目標(${S.target})以上、上限(${S.cap})以下に収めましょう。入れすぎも足りないのもNGです。人狼を見抜いて調整します。`;
  }

  // 自分の役職を常に表示(タップで目標の説明を開く)
  function roleBar() {
    if (!S.me.role || S.phase === 'end') return '';
    const wolf = S.me.role === 'wolf';
    const mates = wolf && S.me.mates.length ? ` ・ 仲間: ${S.me.mates.map((id) => esc(nameOf(id))).join('、')}` : (wolf ? ' ・ 仲間なし' : '');
    const sabTag = S.me.job ? ` ・ ${JOBS[S.me.job].e}${JOBS[S.me.job].n}` : '';
    return `<button class="rolebar ${wolf ? 'wolf' : 'citizen'}" data-act="role">
      <span class="rb-main">${wolf ? '🐺 あなたは人狼' : '🧑‍🌾 あなたは市民'}<small>${mates}${sabTag}</small></span>
      <span class="rb-tap">目標を見る</span></button>`;
  }

  function header() {
    const dots = [];
    for (let i = 1; i <= S.turns; i++) {
      const h = S.history.find((x) => x.turn === i);
      const cur = i === S.turn && S.phase !== 'end';
      dots.push(h
        ? `<span class="dot done"><small>${h.veiled ? '🌫️' : h.total}</small></span>`
        : `<span class="dot ${cur ? 'cur' : ''}">${cur ? '▶' : '·'}</span>`);
    }
    return `<div class="top">
      <div class="topline">
        <span>ターン <b>${Math.min(S.turn, S.turns)}/${S.turns}</b> ・ 🐺×${S.wolfCount} ・ ${MODE_SHORT[S.mode]}</span>
      </div>
      ${roleBar()}
      ${inBattle() ? '' : `<div class="hist">${dots.join('')}</div>
      ${goalBlock(S.delivered, S.me.role === 'wolf' ? S.reserveView : undefined, true)}`}
    </div>`;
  }

  function discussPanel() {
    const leader = amLeader();
    const key = `${S.turn}-${S.attempt}`;
    if (key !== selKey) { selKey = key; selected = new Set(); }
    const lastNote = S.attempt > 1
      ? `<div class="notice warn">前の提案は否決されました(提案 ${S.attempt}/${S.maxAttempt})。${S.attempt === S.maxAttempt ? 'この提案は<b>投票なしで確定</b>します。' : ''}</div>`
      : '';
    const me = S.players.find((p) => p.id === S.me.id);
    let body;
    if (leader) {
      body = `<div class="card stack">
        <h2>👑 あなたがリーダー</h2>
        <p class="sub">話し合いの結果をもとに ${S.need}人 を選んで提案しましょう(自分を含めてもOK)。時間切れは立候補者から自動で決まります。</p>
        <div class="picks">${S.players.map((p) => `<button class="pick ${selected.has(p.id) ? 'on' : ''}" data-act="pick" data-id="${p.id}">${p.volunteer ? '✋' : ''}${esc(p.name)}</button>`).join('')}</div>
        <div class="row">
          <button class="btn small" data-act="fillvol">立候補者を選ぶ</button>
          <button class="btn small" data-act="clearsel">クリア</button>
        </div>
        <button class="btn primary" data-act="propose" ${selected.size === S.need ? '' : 'disabled'}>この${S.need}人で提案(${selected.size}/${S.need})</button>
      </div>`;
    } else {
      body = `<div class="card stack">
        <p>リーダーは <b>${esc(nameOf(S.leaderId))}</b> さん。話し合って、行きたい人は立候補しましょう。</p>
        <button class="btn ${me && me.volunteer ? 'good' : ''}" data-act="volunteer">${me && me.volunteer ? '✋ 立候補中(タップで取消)' : '✋ 立候補する'}</button>
      </div>`;
    }
    return `${taskCard(`<div>${timerHtml()}</div>`)}${lastNote}${body}`;
  }

  function votePanel() {
    const v = S.my.vote;
    return `${taskCard('')}
      <div class="card stack">
        <h2>提案されたメンバー ${timerHtml()}</h2>
        ${teamChips(S.proposal)}
        <p class="sub">リーダー: ${esc(nameOf(S.leaderId))}(提案 ${S.attempt}/${S.maxAttempt}) ・ 投票済み ${S.players.filter((p) => p.voted).length}/${S.n}</p>
        <div class="row">
          <button class="btn good ${v === true ? 'sel' : ''}" data-act="vote" data-v="1">👍 賛成</button>
          <button class="btn bad ${v === false ? 'sel' : ''}" data-act="vote" data-v="0">👎 反対</button>
        </div>
        <p class="sub">${v === undefined ? '時間内に投票しないと賛成扱いになります。' : '投票済み(締め切りまで変更できます)'}</p>
      </div>`;
  }

  function voteResultPanel() {
    const ys = []; const ns = []; const ab = [];
    for (const p of S.players) {
      const v = S.lastVotes ? S.lastVotes[p.id] : null;
      (v === true ? ys : v === false ? ns : ab).push(p.name);
    }
    const list = (a) => (a.length ? a.map(esc).join('、') : '—');
    return `${taskCard('')}
      <div class="card stack">
        <h2>${S.approved ? '✅ 可決' : '❌ 否決'}</h2>
        ${teamChips(S.proposal)}
        <div class="votecols">
          <div class="y"><h3>👍 賛成 ${S.tally ? S.tally.yes : ys.length + ab.length}</h3><p class="sub">${list(ys)}${ab.length ? `<br>(未投票→賛成扱い: ${list(ab)})` : ''}</p></div>
          <div class="n"><h3>👎 反対 ${S.tally ? S.tally.no : ns.length}</h3><p class="sub">${list(ns)}</p></div>
        </div>
        <p class="sub center">${S.approved ? 'まもなくタスクに出発します…' : 'リーダーが交代して再提案します…'}</p>
      </div>`;
  }

  // 納品数の補足表示(納品/備蓄 または 持ち帰り)
  const canDiscard = () => S.me.role === 'wolf'; // 納品にも備蓄にも回さない(捨てる)は、人狼だけが選べる。市民は納品しなかった分が全部備蓄になる
  function amtNote() {
    const v = S.my.reward;
    return S.mode === 'advanced'
      ? (canDiscard() ? `納品 <b>${amt}</b> ・ 備蓄 <b>${rsv}</b> ・ 捨てる <b>${v - amt - rsv}</b>` : `納品 <b>${amt}</b> ・ 備蓄 <b>${v - amt}</b>`)
      : `残りの ${v - amt} 個は持ち帰り(使われません)`;
  }

  // 納品数に合わせて備蓄数を整える(備蓄を触っていなければ残り全部、触っていれば残りの範囲に収める)
  function syncRsv() {
    const v = S.my.reward;
    if (v === undefined) return;
    rsv = !canDiscard() || rsvAuto ? v - amt : Math.min(rsv, v - amt);
  }
  const deliverLabel = () => (S.mode === 'advanced' ? `納品${amt}・備蓄${canDiscard() ? rsv : S.my.reward - amt}で確定する` : `${amt}個 納品する`);

  // 納品数の入力中は画面全体を作り直さず、表示だけを更新する(スライダーの操作が途切れないように)
  function patchAmt() {
    if (!S || S.my.reward === undefined) return;
    const set = (sel, html) => { const el = $(sel); if (el) el.innerHTML = html; };
    syncRsv();
    set('.amt', amt);
    set('.amtnote', amtNote());
    set('[data-act="deliver"]', deliverLabel());
    set('.rsvval', rsv);
    const rs = $('.rsvslider');
    if (rs) { rs.max = S.my.reward - amt; if (Number(rs.value) !== rsv) rs.value = rsv; }
    const dec = $('[data-act="dec"]');
    const inc = $('[data-act="inc"]');
    if (dec) dec.disabled = amt <= 0;
    if (inc) inc.disabled = amt >= S.my.reward;
    const sl = $('.slider');
    if (sl && Number(sl.value) !== amt) sl.value = amt;
  }

  // 報酬の表示(納品を決める前・決めたあと)
  function rewardHead(P, my) {
    const nDown = P.kind === 'battle' ? P.allies.filter((a) => a.alive === false).length : 0;
    const koPct = Math.round((1 - Math.max(G_KO_FLOOR, 1 - G_KO_PENALTY * nDown)) * 100);
    const koNote = nDown ? `<div class="notice warn">💀 戦闘不能が${nDown}人出たため、全員の報酬が${koPct}%減っています。</div>` : '';
    const note = P.kind === 'battle'
      ? koNote + (P.win ? '<div class="notice">🎉 バトルに勝利!与えたダメージが多い人ほど報酬が多くなります。</div>' : '<div class="notice warn">💀 バトルに敗北…全員の報酬が半分になっています。</div>')
      : P.kind === 'mine'
      ? (P.hit ? '<div class="notice warn">💥 地雷が出ました。探索した全員の報酬が25%減っています(75%を受け取り)。</div>' : '<p class="sub center">地雷は出ませんでした。</p>')
      : '<p class="sub center">あなたの担当ぶんの成功率で決まりました。相手の報酬は伏せられています。</p>';
    return `<div class="drawn"><div class="pcard face ${(P.kind === 'mine' && P.hit) || (P.kind === 'battle' && !P.win) ? 'hit' : ''}">${my.reward}</div></div>
      <p class="center">あなたの報酬は <b>${my.reward}</b> です。</p>${note}`;
  }

  // バトル: 全員が同時にコマンドを選ぶ → まとめて処理 → ログを見る、を繰り返す
  const ATTR = { fire: '🔥火', water: '💧水', grass: '🌿草' };
  const CMD_NAME = { attack: 'たたかう', charge: 'チャージ', skill: 'スキル', ultimate: '奥義', share: 'HPを分ける' };
  const hpBar = (hp, max, cls = '') => `<div class="hpbar ${cls}"><i style="width:${Math.max(0, Math.round(hp / max * 100))}%"></i></div>`;
  const critTag = (a) => (a.crit ? '<span class="crit">💥クリティカル!</span> ' : '');
  const FX_ICON = { burn: '🔥', blind: '💫', weak: '⬇️' };
  const FX_NAME = { burn: '火傷', blind: '命中率低下', weak: '火力ダウン' };
  const fxBadges = (fx) => (fx ? Object.keys(FX_ICON).filter((k) => fx[k] > 0).map((k) => `<i class="fxb ${k}" title="${FX_NAME[k]}(あと${fx[k]}ラウンド)">${FX_ICON[k]}${fx[k]}</i>`).join('') : '');
  function actLine(a, P) {
    const l = actLine0(a, P);
    return a.weak ? l.replace('</li>', ' <small class="sub">⬇️火力ダウン</small></li>') : l;
  }
  function actLine0(a, P) {
    const who = esc(nameOf(a.id));
    const god = !!(P && P.god); // 神視点: 本当のダメージと、人狼の手加減・妨害の指定も出す
    const dm = god ? ` <b class="gdmg">${a.dmg}ダメージ</b>` : '';
    const tg = god ? (a.soft ? ' <small class="sabnote">🐺手加減</small>' : '') + (a.sab ? ' <small class="sabnote">🐺妨害指定</small>' : '') : '';
    if (a.miss) return `<li>${who}の${a.cmd === 'ultimate' ? '奥義' : a.cmd === 'skill' ? 'スキル' : '攻撃'}は<b>外れた</b>!💫${tg}</li>`;
    if (a.cmd === 'charge') return `<li>${who}は力をためた(ためた累計 ⚡${a.charge})${tg}</li>`;
    if (a.cmd === 'share') return `<li>💝 ${who}は${esc(nameOf(a.target))}にHPを<b>${a.amount}</b>分け与えた${tg}</li>`;
    if (a.cmd === 'attack') return `<li>${who}の攻撃! ${critTag(a)}${dm}${tg}</li>`;
    if (a.cmd === 'skill') return `<li>${who}(${ATTR[a.attr]}属性)のスキル! ${critTag(a)}${dm}${tg}<small class="sub">${a.mult > 1 ? '効果ばつぐん' : a.mult < 1 ? 'いまひとつ' : '効果はふつう'}(敵は${ATTR[a.enemyAttr]}属性)</small></li>`;
    return `<li>${who}の奥義!! ${critTag(a)}${dm}${tg}</li>`;
  }
  // 敵の奥義の状態異常(だれがかかったか・火傷のダメージ・エルフキングの回復)
  function fxLog(l) {
    let out = '';
    const f = l.fx;
    if (f) {
      const names = (f.ids || []).map((id) => esc(nameOf(id))).join('・');
      if (f.kind === 'heal') out += f.heal > 0 ? `<li class="enemy fxl">🌿 <b>敵が回復した!</b> HP +${f.heal}</li>` : '<li class="enemy fxl">🌿 敵は回復しようとしたが、失敗した</li>';
      else out += names ? `<li class="enemy fxl">${FX_ICON[f.kind]} <b>${names}</b>が<b>${FX_NAME[f.kind]}</b>になった!</li>` : `<li class="enemy fxl">${FX_ICON[f.kind]} ${FX_NAME[f.kind]}にかかった人はいなかった</li>`;
    }
    // 人狼のチャージ妨害(誰がやったかは出ない)
    for (const sb of l.sab || []) out += sb.type === 'enemy' ? '<li class="enemy fxl">⬆️ <b>敵が力をみなぎらせた!</b> 攻撃力アップ</li>' : `<li class="enemy fxl">⬇️ <b>${esc(nameOf(sb.id))}</b>の力が抜けた…<b>火力ダウン</b></li>`;
    if (l.buffed) out += '<li class="enemy fxl">⬆️ 力をみなぎらせた敵の攻撃!</li>';
    for (const b of l.burns || []) out += `<li class="enemy fxl">🔥 ${esc(nameOf(b.id))}は火傷で<b>${b.dmg}</b>ダメージ${b.hp <= 0 ? ' …戦闘不能!' : ''}</li>`;
    return out;
  }
  function logHtml(l, P) {
    return `<ul class="blog">${l.acts.map((a) => actLine(a, P)).join('')}

  // ダメージの数字が敵の上にポップする(奥義は金色で大きく、スキルは相性で色が変わる)。攻撃の順に少しずつずらして出す

    let main;

    } else {

          ${wolf && cmdSel !== 'charge' ? `<label class="softrow"><input type="checkbox" data-act="soft" ${softOn ? 'checked' : ''}> 🐺 手加減する(ダメージが低めの乱数になる)</label>` : ''}
          ${wolf && P.me.sabCmd && cmdSel === P.me.sabCmd ? `<label class="softrow"><input type="checkbox" data-act="sab" ${sabOn ? 'checked' : ''}> 🐺 妨害する(追加効果: 確率で、味方1人の火力を下げるか、敵を強くします。誰がやったかは分かりません)</label>` : ''}

  }
  function shareNote(myHp, hp, amt) { return `あなた HP${myHp} → <b>${myHp - amt}</b> ／ 相手 HP${hp} → <b>${hp + amt}</b>`; }
  function patchShare() {

  // 地雷ゲーム: 同じ盤面からタイルを1枚ずつ引く
  function mineBody(P) {
    const taken = new Set(P.taken);
    const B = P.board; // 人狼だけ: 地雷がありそうな3枚と、全タイルの数字

      : `<p class="sub">この盤面には<b>地雷が1つ</b>だけ埋まっています。1人1枚ずつ好きなタイルを引き、数字がそのまま報酬になります。<b>地雷を引くと、探索した全員の報酬が25%減ります</b>(75%を受け取る)。引いた本人にも、地雷だったかは分かりません(全員が引き終わったあと「地雷が出た」ことだけが分かります)。<br>どれか1枚は<b>🎁+1カード</b>で、引いた人だけがもう1枚追加で引けます(数字は足されます)。誰が引いたかは本人以外には分かりません。</p>`;

  // 記憶ゲーム: 数列の半分ずつを見て、通話で教え合い、全体を入力する
  function memoryBody(P) {
    const key = `${S.turn}-${P.round}`;
