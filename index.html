    if (P.sub === 'ready') {
      return `${head}
        <p class="center">この回、あなたが見るのは数列の<b>${partName}</b>(${span}桁目)です。<br>相手は残りの半分を見ます。</p>
        <p class="sub">数字は<b>数秒だけ</b>表示されます。覚えたら、<b>通話で相手に伝え</b>、相手の分も聞いて、あとで<b>数列全体</b>を入力します。</p>
        <button class="btn primary" data-act="memready" ${P.ready ? 'disabled' : ''}>${P.ready ? '相手の準備を待っています…' : '準備OK(押すと数字が出ます)'}</button>`;
    }
    if (P.sub === 'show') {
      return `${head}
        <p class="center">あなたの担当: <b>${partName}</b>(${span}桁目)</p>
        <div class="digits big">${(P.digits || []).map((d) => `<span>${d}</span>`).join('')}</div>
        <p class="sub center">覚えて、通話で相手に伝えましょう。もうすぐ消えます。</p>`;
    }
    if (P.submitted) {
      return `${head}<p class="center">入力を確定しました。相手を待っています…</p>
        <div class="digits">${Array.from({ length: P.len }, (_, i) => `<span>${memDigits[i] !== undefined ? memDigits[i] : '・'}</span>`).join('')}</div>`;
    }
    const slots = Array.from({ length: P.len }, (_, i) => `<span class="${i === memDigits.length ? 'cur' : ''} ${i >= P.half * P.part && i < P.half * (P.part + 1) ? 'mine' : ''}">${memDigits[i] !== undefined ? memDigits[i] : '・'}</span>`).join('');
    const pad = [1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button class="padbtn" data-act="memdigit" data-d="${d}">${d}</button>`).join('')
      + '<button class="padbtn" data-act="memdel">⌫</button><button class="padbtn" data-act="memdigit" data-d="0">0</button>'
      + `<button class="padbtn ok" data-act="memsubmit">確定</button>`;
    return `${head}
      <p class="center">数列全体(${P.len}桁)を順番に入力してください。<br><small class="sub">枠の色つきがあなたが見た${partName}です。残りは相手に聞いた数字を入れます。</small></p>
      <div class="digits">${slots}</div>
      <div class="pad">${pad}</div>
      <p class="sub">時間内に確定しなかった場合は、入力中の数字がそのまま使われます。</p>`;
  }

  function collectPanel() {
    const onTeam = S.proposal.includes(S.me.id);
    const done = S.players.filter((p) => p.submitted).length;
    const forced = S.forced ? '<div class="notice warn">3回目の提案のため、投票なしで確定しました。</div>' : '';
    if (!onTeam && inBattle()) {
      return `<div class="card stack"><h2>👀 バトルを観戦中 ${timerHtml()}</h2>${battleBody(S.play)}</div>`;
    }
    if (!onTeam) {
      return `${taskCard('')}${forced}
        <div class="card stack">
          <h2>タスク実行中… ${timerHtml()}</h2>
          ${teamChips(S.proposal)}
          <p class="sub">選ばれたメンバーがミニゲームを行い、納品しています(${done}/${S.proposal.length}人 完了)。結果を待ちましょう。</p>
        </div>
        ${S.play && S.play.kind === 'battle' && S.play.stage === 'play' ? `<div class="card stack"><h2>👀 バトルを観戦中</h2>${battleBody(S.play)}</div>` : ''}`;
    }
    const my = S.my;
    const adv = S.mode === 'advanced';
    const P = S.play;
    let body;
    if (!P) {
      body = '<p class="sub">読み込み中…</p>';
    } else if (P.stage === 'play') {
      body = P.kind === 'battle' ? battleBody(P) : P.kind === 'mine' ? mineBody(P) : memoryBody(P);
    } else if (my.delivered === undefined) {
      const key = `${S.turn}-${my.reward}`;
      if (amtKey !== key) { amtKey = key; amt = adv ? Math.round(my.reward * S.shareHint) : my.reward; rsvAuto = true; }
      syncRsv();
      body = `${rewardHead(P, my)}
        <p class="center">いくつ納品しますか?</p>
        <div class="stepper">
          <button class="btn small" data-act="dec" ${amt <= 0 ? 'disabled' : ''}>−</button>
          <div class="amt">${amt}</div>
          <button class="btn small" data-act="inc" ${amt >= my.reward ? 'disabled' : ''}>＋</button>
        </div>
        <input class="slider" type="range" min="0" max="${my.reward}" step="1" value="${amt}" aria-label="納品数">
        <div class="row quick">
          <button class="btn small" data-act="setamt" data-v="zero">0</button>
          <button class="btn small" data-act="setamt" data-v="half">半分</button>
          <button class="btn small" data-act="setamt" data-v="max">全部</button>
        </div>
        ${adv && canDiscard() ? `<div class="rsvbox">
          <div class="rsvhead"><span>備蓄する数</span><b class="rsvval">${rsv}</b></div>
          <input class="slider rsvslider" type="range" min="0" max="${my.reward - amt}" step="1" value="${rsv}" aria-label="備蓄数">
          <div class="row quick">
            <button class="btn small" data-act="rsvnone">備蓄なし(捨てる)</button>
            <button class="btn small" data-act="rsvall">残りは全部備蓄</button>
          </div>
        </div>` : ''}
        <p class="center sub amtnote">${amtNote()}</p>
        <button class="btn primary" data-act="deliver">${deliverLabel()}</button>
        <p class="sub">${adv
          ? `納品の合計は目標(${S.target})以上・上限(${S.cap})以下(いまの納品合計 ${S.delivered})、備蓄の合計も目標以上が必要です。納品しすぎると溢れて負けです。${canDiscard() ? '納品にも備蓄にも回さなかった分は捨てられます。' : '納品しなかった分は、自動で備蓄されます。'}`
          : `倉庫の上限は ${S.cap}(いまの納品合計 ${S.delivered})。入れすぎると溢れて負けです。`}納品した数は他の人には見えません(ターンの合計だけが発表されます)。確定後は変更できません。時間切れの場合は${adv ? `${Math.round(my.reward * S.shareHint)}個を納品し、残りは備蓄` : '全部納品'}します。</p>`;
    } else {
      body = `${rewardHead(P, my)}
        <p class="center"><b>${my.delivered}個</b> 納品しました${adv ? `(備蓄 ${my.reserved === undefined ? my.reward - my.delivered : my.reserved}個${canDiscard() ? `・捨てる ${my.reward - my.delivered - (my.reserved === undefined ? my.reward - my.delivered : my.reserved)}個` : ''})` : ''}。</p>
        <p class="sub center">他のメンバーを待っています(${done}/${S.proposal.length}人 納品済み)。</p>`;
    }
    if (inBattle()) {
      return `<div class="card stack">
        <h2>⚔️ バトル ${timerHtml()}</h2>
        ${body}
      </div>`;
    }
    return `${taskCard('')}${forced}
      <div class="card stack">
        <h2>あなたが選ばれました ${timerHtml()}</h2>
        ${teamChips(S.proposal)}
        ${body}
      </div>`;
  }

  function resultPanel() {
    const h = S.history[S.history.length - 1];
    return `${taskCard('')}
      <div class="card stack">
        ${h.veiled
          ? `<div class="deliv"><div class="n">？</div><div class="u">🌫️ 濃霧で、納品数が伏せられました</div></div>`
          : `<div class="deliv"><div class="n">${h.total}</div><div class="u">${h.task.emoji} ${esc(h.task.item)}が納品されました</div></div>`}
        ${teamChips(h.team)}
        ${h.battleWin === true ? '<div class="notice">⚔️ このターンはバトルに勝利しました。</div>' : h.battleWin === false ? '<div class="notice warn">⚔️ このターンはバトルに敗北し、探索した全員の報酬が半分になりました。</div>' : ''}${h.kind === 'battle' && h.downs && h.downs.length ? `<div class="notice warn">💀 戦闘不能${h.downs.length}人で、全員の報酬が${Math.round((1 - h.koFactor) * 100)}%減りました。</div>` : ''}
        ${h.mineHit ? '<div class="notice warn">💥 このターンは地雷が出て、探索した全員の報酬が25%減りました(75%を受け取り)。</div>' : ''}
        <p class="sub center">${S.turn >= S.turns ? 'まもなく最終結果です…' : '次のターンへ… '}${timerHtml()}</p>
      </div>`;
  }

  // ターンごとの記録の表の行(終了画面・観戦で共通)
  const turnRows = (history, mode) => history.map((h) => `<tr>
      <td>${h.turn}</td>
      <td>${h.task.emoji}</td>
      <td>${h.team.map((id) => `<span>${esc(nameOf(id))} ${h.amounts[id]}/${h.drawn[id]}${mode === 'advanced' && h.reserved ? `(備${h.reserved[id]}・捨${h.discarded[id]})` : ''}${h.hitBy === id ? ' 💥' : ''}${h.rates ? ` <small class="sabnote">成功率${Math.round(h.rates[id] * 100)}%</small>` : ''}</span>`).join('<br>')}${h.kind === 'mine' && h.mineHit ? `<br><small class="sabnote">💥 地雷: ${esc(nameOf(h.hitBy))}が引いた</small>` : ''}${h.kind === 'battle' && h.dealt ? `<br><small class="sabnote">⚔️ ${h.battleWin ? '勝利' : '敗北'}: 与ダメージ ${h.team.map((id) => `${esc(nameOf(id))} ${h.dealt[id]}${h.downs && h.downs.includes(id) ? '💀' : ''}`).join(' / ')}</small>` : ''}${h.kind === 'mine' && h.plusBy ? `<br><small class="sabnote">🎁 +1カード: ${esc(nameOf(h.plusBy))}が引いた</small>` : ''}</td>
      <td>${h.total}${h.veiled ? '<br><small class="sabnote">🌫️ 濃霧で伏せられた</small>' : ''}</td></tr>`).join('');

  function endPanel() {
    const f = S.final;
    const wolves = S.players.filter((p) => f.roles[p.id] === 'wolf').map((p) => p.name);
    const holders = (job) => S.players.filter((p) => f.jobs && f.jobs[p.id] === job).map((p) => p.name);
    const jobBlock = (job, cls) => (holders(job).length ? `<h2 style="margin-top:8px">${JOBS[job].e} ${JOBS[job].n}は</h2><div class="chips">${holders(job).map((n) => `<span class="chip ${cls}">${JOBS[job].e} ${esc(n)}</span>`).join('')}</div>` : '');
    const reserves = {}; // 上級者モード: 一人ひとりの備蓄(引いた数 − 納品)
    f.history.forEach((h) => h.team.forEach((id) => { reserves[id] = (reserves[id] || 0) + (h.reserved ? h.reserved[id] : h.drawn[id] - h.amounts[id]); }));
    const iWon = (f.winner === 'citizen') === (f.roles[S.me.id] !== 'wolf');
    const rows = turnRows(f.history, f.mode);
    const swaps = (f.swaps || []).map((x) => `<p class="sub">🔄 ターン${x.turn}の提案${x.attempt}回目: 賛成${x.yes}・反対${x.no} を入れ替え → ${x.approved ? '可決' : '否決'}になった</p>`).join('');
    const head = f.aborted
      ? `<div class="banner aborted">🛑 ゲームを中断しました</div>
      <p class="center sub">途中までの記録です(勝敗はつきません)</p>`
      : `<div class="banner ${f.winner}">${f.winner === 'citizen' ? '🧑‍🌾 市民の勝利!' : '🐺 人狼の勝利!'}</div>
      <p class="center">${iWon ? '🎉 あなたの勝ちです' : '😢 あなたの負けです'}</p>`;
    return `${head}
      <div class="card stack">
        ${f.aborted ? '' : `<p class="center sub">${f.winner === 'citizen' ? '目標をすべて達成しました' : f.reasons.map((r) => REASON[r]).join(' / ')}</p>`}
        ${goalBlock(f.total, f.mode === 'advanced' ? f.reserveTotal : undefined)}
      </div>
      ${f.mode === 'advanced' ? `<div class="card stack">
        <h2>備蓄の内訳</h2>
        <div class="chips">${S.players.filter((p) => p.id in reserves).map((p) => `<span class="chip">${esc(p.name)} ${reserves[p.id]}</span>`).join('')}</div>
      </div>` : ''}
      <div class="card stack">
        <h2>🐺 人狼は</h2>
        <div class="chips">${wolves.map((n) => `<span class="chip mate">🐺 ${esc(n)}</span>`).join('')}</div>
        ${jobBlock('veil', 'mate')}${jobBlock('swap', 'mate')}
        ${holders('keeper').length || holders('seer').length ? '<h2 style="margin-top:8px">🧑‍🌾 村人側の役職</h2>' : ''}
        ${jobBlock('keeper', 'team')}${jobBlock('seer', 'team')}
        ${swaps}
      </div>
      <div class="card">
        <h2>ターンごとの記録</h2>
        <table><tr><th>T</th><th></th><th>メンバー 納品/引いた数${f.mode === 'advanced' ? '(備蓄・捨てた数)' : ''}</th><th>納品計</th></tr>${rows}</table>
      </div>
      ${isHost() ? '<button class="btn primary" data-act="again">もう一度遊ぶ(ロビーへ)</button>' : '<p class="sub center">ホストが再開するのを待っています…</p>'}
      <button class="btn small" data-act="leave">退出</button>`;
  }

  // 回数の表示
  const usesText = (r) => (r.unlimited ? '回数は無制限' : `あと${r.left}回`);

  // 📦 倉庫管理者: ターンの始め(話し合い中)に倉庫の総数を確認する
  function keeperCard() {
    const k = S.me.keeper;
    if (!k || S.phase === 'end') return '';
    const results = k.results.length
      ? `<div class="chips">${k.results.map((r) => `<span class="chip">ターン${r.turn}の始め: 備蓄 <b>${r.reserve}</b> ・ 納品(本当の合計) <b>${r.delivered}</b></span>`).join('')}</div>`
      : '<p class="sub">まだ確認していません。</p>';
    const note = S.turn > k.lastTurn
      ? `残り${KEEPER_LAST}ターンになったので、もう確認できません。`
      : (S.phase !== 'discuss' ? 'ターンの始めの話し合い中に確認できます。' : `ターン${k.lastTurn}まで確認できます。`);
    return `<div class="card stack">
      <h2>📦 倉庫管理者(${usesText(k)})</h2>
      ${results}
      <button class="btn good" data-act="check" ${k.canNow ? '' : 'disabled'}>倉庫の総数を確認する</button>
      <p class="sub">${note}終わったターンまでの、備蓄の合計と実際の納品の合計(霧で伏せられたぶんも含む)が分かります。結果は自分にだけ見えます。</p>
    </div>`;
  }

  // 🔮 占い師: 待機中に、いま探索している中に人狼がいるかを知る
  function seerCard() {
    const r = S.me.seer;
    if (!r || S.phase === 'end') return '';
    const results = r.results.length
      ? `<div class="chips">${r.results.map((x) => `<span class="chip ${x.found ? 'mate' : 'team'}">ターン${x.turn}: ${x.team.map((id) => esc(nameOf(id))).join('・')} → ${x.found ? '🐺 人狼がいる' : '✅ 人狼はいない'}</span>`).join('')}</div>`
      : '<p class="sub">まだ占っていません。</p>';
    let note;
    if (r.canNow) note = 'いま探索している中に、人狼がいるかを占えます(人数は分かりません)。';
    else if (r.left <= 0 && !r.unlimited) note = '占える回数を使い切りました。';
    else if (S.phase !== 'collect') note = 'タスクをしている間(ミニゲームや納品の間)に占えます。自分が探索に選ばれていないターンだけです。';
    else if (r.usedNow) note = 'このターンはもう占いました(同じ探索メンバーなので結果は変わりません)。';
    else if (S.proposal.includes(S.me.id)) note = 'あなたは探索に選ばれているので、このターンは占えません。';
    else note = 'いまは占えません。';
    return `<div class="card stack">
      <h2>🔮 占い師(1ゲームであと${r.unlimited ? '何回でも' : `${r.left}回`}占える)</h2>
      ${results}
      <button class="btn good" data-act="seer" ${r.canNow ? '' : 'disabled'}>いまの探索メンバーを占う</button>
      <p class="sub">${note}結果は自分にだけ見えます。</p>
    </div>`;
  }

  // 🌫️ 霧使い(人狼): そのターンの納品数を完全に伏せる
  function veilCard() {
    const v = S.me.veil;
    if (!v || S.phase === 'end') return '';
    const seen = v.hidden.length
      ? `<div class="chips">${v.hidden.map((x) => `<span class="chip mate">ターン${x.turn}の本当の納品数: <b>${x.total}</b></span>`).join('')}</div>` : '';
    let note;
    if (v.canNow) note = 'そのターンの納品数を完全に伏せます(合計が発表されず、納品の累計にも含まれません)。';
    else if (v.usedNow) note = 'このターンは濃霧を使いました。納品数は発表されません。';
    else if (v.left <= 0 && !v.unlimited) note = '使える回数を使い切りました。';
    else note = 'タスクをしている間(ミニゲームや納品の間)に使えます。';
    return `<div class="card stack">
      <h2>🌫️ 霧使い(${usesText(v)}・1ターンに1回まで)</h2>
      ${seen}
      <button class="btn bad" data-act="veil" ${v.canNow ? '' : 'disabled'}>濃霧を出す(このターンの納品数を伏せる)</button>
      <p class="sub">${note}使った本人にだけ、本当の数が見えます。</p>
    </div>`;
  }

  // 🔄 すり替え屋(人狼): 投票の票数を入れ替える
  function swapCard() {
    const w = S.me.swap;
    if (!w || S.phase === 'end') return '';
    let body;
    if (w.canToggle) {
      body = `<button class="btn ${w.on ? 'bad' : ''}" data-act="swaptoggle">${w.on ? '🔄 すり替え: ON(タップでOFF)' : '🔄 すり替え: OFF(タップでON)'}</button>
        <p class="sub">ONのまま投票が集計されると、賛成と反対の票数が入れ替わって集計され、可決と否決が逆になります(同数のときは変わりません)。集計されたときに回数を1つ使います。</p>`;
    } else if (w.left <= 0 && !w.unlimited) {
      body = '<p class="sub">使える回数を使い切りました。</p>';
    } else {
      body = '<p class="sub">投票の間にONにできます。3回目の提案(投票なしで確定)では使えません。</p>';
    }
    return `<div class="card stack"><h2>🔄 すり替え屋(${usesText(w)})</h2>${body}</div>`;
  }

  // 自分の役職の説明(開始時の表示・目標の再表示で使う)
  function jobHelp() {
    const j = S.me.job;
    if (j === 'keeper') return `📦 あなたは倉庫管理者です。ターンの始め(話し合い中)に、倉庫の総数(備蓄の合計と実際の納品の合計)を確認できます(${S.me.keeper.unlimited ? '回数は無制限' : `全部で${S.me.keeper.left + S.me.keeper.results.length}回まで`}・残り${KEEPER_LAST}ターンになるまで)。`;
    if (j === 'seer') return `🔮 あなたは占い師です。自分が待機中のターンの、タスクをしている間に、いま探索している中に人狼がいるかを占えます(人数は分かりません。${S.me.seer.unlimited ? '回数は無制限' : `1ゲーム中に全部で${S.me.seer.left + S.me.seer.results.length}回まで`}。同じターンに2回は占えません)。`;
    if (j === 'veil') return `🌫️ あなたは霧使いです。タスクをしている間に濃霧を出すと、そのターンの納品数が完全に伏せられます(${S.me.veil.unlimited ? '回数は無制限' : `全部で${S.me.veil.left + S.me.veil.hidden.length}回まで`})。使った本人には本当の数が見えます。`;
    if (j === 'swap') return `🔄 あなたはすり替え屋です。投票の間にONにすると、賛成と反対の票数が入れ替わって集計されます(${S.me.swap.unlimited ? '回数は無制限' : `全部で${S.me.swap.left}回まで`}。3回目の強制確定では使えません)。`;
    return '';
  }

  // 過去のターンの振り返り(どのタスクを、誰が行って、いくつ納品されたか)。個人ごとの数は終了まで非公開
  function historyCard() {
    if (!S.history.length) return '<div class="card stack"><h2>📜 これまでの結果</h2><p class="sub">1ターン目が終わると、ここにタスクを行ったメンバーと納品数が並びます。</p></div>';
    const rows = S.history.map((h) => `<div class="hrow">
        <div class="hhead"><span>${h.turn}. ${h.task.emoji} ${esc(h.task.name)}${h.mineHit ? ' 💥' : ''}${h.battleWin === true ? ' 🏆' : h.battleWin === false ? ' 💀' : ''}</span><b>${h.veiled ? '？' : h.total}</b></div>
        ${teamChips(h.team)}
      </div>`).join('');
    return `<div class="card stack"><h2>📜 これまでの結果</h2>${rows}</div>`;
  }

  function abortButton() {
    if (!isHost() || S.phase === 'end') return '';
    return '<button class="btn small" data-act="abort">🛑 ゲームを中断して終了する(ホストのみ)</button>';
  }

  /* ---------- 観戦(神視点) ----------
     ゲーム中にルームコードで入った人は観戦者になり、役職・ミニゲームの中身・バトルの全コマンドと本当のダメージ・納品の内訳・チャットを、すべて見られる。操作や発言はできない。 */
  const roleIcon = (id) => { const r = S.god.roles[id]; const j = S.god.jobs[id]; return (r === 'wolf' ? '🐺' : '🧑‍🌾') + (j ? JOBS[j].e : ''); };
  // 観戦画面の各項目は、見出しをタップして折りたためる(開閉は端末に覚えさせる)
  const GOD_KEYS = ['turn', 'play', 'gcmd', 'deliver', 'players', 'plan', 'chat', 'history'];
  const godShut = (() => { try { const v = JSON.parse(localStorage.getItem('tw-godshut') || 'null'); if (Array.isArray(v)) return new Set(v); } catch (e) { /* noop */ } return new Set(['plan', 'chat', 'history']); })();
  const saveShut = () => { try { localStorage.setItem('tw-godshut', JSON.stringify([...godShut])); } catch (e) { /* noop */ } };
  function fold(key, title, inner, sum) {
    const shut = godShut.has(key);
    return `<div class="card fold ${shut ? 'shut' : ''}"><button class="foldhead" data-act="gfold" data-k="${key}"><span>${title}${shut && sum ? ` <small class="sub">${sum}</small>` : ''}</span><i>${shut ? '▸' : '▾'}</i></button>${shut ? '' : `<div class="foldbody stack">${inner}</div>`}</div>`;
  }
  function godChip(p) {
    const G = S.god;
    const wolf = G.roles[p.id] === 'wolf';
    const b = [];
    if (p.leader) b.push('👑');
    if (p.volunteer && S.phase === 'discuss') b.push('✋');
    if ((S.phase === 'vote' || S.phase === 'voteResult') && p.id in G.votes) b.push(G.votes[p.id] ? '⭕' : '❌');
    if (p.submitted === true) b.push('✔');
    if (!p.connected) b.push('🔌');
    const cls = ['chip'];
    if (wolf) cls.push('mate');
    if (['vote', 'voteResult', 'collect'].includes(S.phase) && p.inTeam) cls.push('team');
    return `<span class="${cls.join(' ')}">${roleIcon(p.id)} ${b.join('')} ${esc(p.name)}</span>`;
  }
  const godChipId = (id) => { const p = S.players.find((x) => x.id === id); return p ? godChip(p) : ''; };
  function godPhaseText() {
    const a = S.attempt > 1 && ['discuss', 'vote', 'voteResult'].includes(S.phase) ? `(提案${S.attempt}回目)` : '';
    switch (S.phase) {
      case 'discuss': return `🗣 話し合い${a}`;
      case 'vote': return `🗳 投票中${a}`;
      case 'voteResult': return `📊 投票結果${a}`;
      case 'collect': { const g = S.god.game; if (!g) return '🎯 探索中'; return g.stage === 'deliver' ? '📦 納品を決めている' : { mine: '🎴 地雷ゲーム', memory: '🧠 記憶ゲーム', battle: '⚔️ バトル' }[g.kind]; }
      case 'result': return '📦 ターンの結果';
      default: return '🏁 終了';
    }
  }
  function godHeader() {
    const dots = [];
    for (let i = 1; i <= S.turns; i++) {
      const h = S.history.find((x) => x.turn === i);
      const cur = i === S.turn && S.phase !== 'end';
      dots.push(h ? `<span class="dot done"><small>${h.total}</small></span>` : `<span class="dot ${cur ? 'cur' : ''}">${cur ? '▶' : '·'}</span>`);
    }
    return `<div class="top">
      <div class="godbar"><span>👁 神視点で観戦中</span><small>ルーム ${esc(S.code)}</small></div>
      <div class="topline"><span>ターン <b>${Math.min(S.turn, S.turns)}/${S.turns}</b> ・ 🐺×${S.wolfCount} ・ ${MODE_SHORT[S.mode]}</span><span>${godPhaseText()} ${timerHtml()}</span></div>
      <div class="hist">${dots.join('')}</div>
      ${goalBlock(S.delivered, S.reserveView, false)}
      ${S.god.hiddenSum ? `<p class="sub">🌫️ 濃霧で、参加者には見えていない納品(計${S.god.hiddenSum})も含めた本当の数字です</p>` : ''}
    </div>`;
  }
  function godPlayers() {
    const G = S.god;
    const jobRows = Object.keys(G.jobs).filter((id) => G.jobs[id]).map((id) => {
      const j = G.jobs[id];
      const left = G.uses && G.uses[id] !== undefined ? (G.uses[id] >= 99 ? '回数は無制限' : `あと${G.uses[id]}回`) : '';
      const lg = (G.jobLogs[id] || []).map((x) => (j === 'seer' ? `T${x.turn}:${x.found ? '人狼あり' : '人狼なし'}` : j === 'keeper' ? `T${x.turn}:納品${x.delivered}・備蓄${x.reserve}` : `T${x.turn}:納品${x.total}を伏せた`)).join(' / ');
      return `<p class="sub">${JOBS[j].e} <b>${JOBS[j].n}</b>: ${esc(nameOf(id))}(${left})${lg ? ` ${esc(lg)}` : ''}</p>`;
    }).join('');
    const state = [G.veilOn ? '🌫️ このターンは濃霧が使われた' : '', G.swapOn ? '🔄 すり替えが準備中' : '', G.seerUsed ? '🔮 このターンは占い済み' : ''].filter(Boolean).join(' ・ ');
    return fold('players', '参加者(役職つき)', `<div class="chips">${S.players.map(godChip).join('')}</div>
      ${jobRows}${state ? `<p class="sub">${state}</p>` : ''}
      <p class="sub">👑リーダー ✋立候補 ⭕賛成 ❌反対 ✔入力済み 🔌切断</p>`, `${S.players.length}人 ・ 🐺${S.wolfCount}`);
  }
  function godPlan() {
    return fold('plan', '全ターンの予定', `<div class="chips">${S.god.plan.map((t) => {
      const h = S.history.find((x) => x.turn === t.turn);
      return `<span class="chip ${t.turn === S.turn && S.phase !== 'end' ? 'team' : ''}">${t.turn}. ${t.emoji} ${t.need}人${t.battle ? ' ⚔️' : ''}${h ? ` → ${h.total}` : ''}</span>`;
    }).join('')}</div>`, `⚔️×${S.god.plan.filter((t) => t.battle).length}`);
  }
  function godTurn() {
    if (S.phase === 'end' || !S.task) return '';
    const G = S.god;
    let vote = '';
    if (S.phase === 'vote') vote = `<p class="sub">投票済み ${Object.keys(G.votes).length}/${S.n}人 (⭕${Object.values(G.votes).filter((v) => v).length} ❌${Object.values(G.votes).filter((v) => !v).length})</p>`;
    if (S.phase === 'voteResult' && S.tally) vote = `<p class="sub">票数 賛成${S.tally.yes}・反対${S.tally.no} → <b>${S.approved ? '可決' : '否決'}</b></p>`;
    return fold('turn', `${S.task.emoji} 今のターン`, `<div class="gturn"><span class="emo">${S.task.emoji}</span><div><b>${esc(S.task.name)}</b><br><small class="sub">必要${S.need}人${S.god.plan[S.turn - 1] && S.god.plan[S.turn - 1].battle ? ' ・ ⚔️バトル' : ''}</small></div></div>
      ${S.proposal.length ? `<div class="chips">${S.proposal.map(godChipId).join('')}</div>` : '<p class="sub">まだ提案はありません</p>'}
      ${vote}`, `${esc(S.task.name)} ${S.proposal.map((id) => esc(nameOf(id))).join('・')}`);
  }
  function godMine(g) {
    const owner = {};
    Object.keys(g.picks).forEach((id) => { owner[g.picks[id]] = nameOf(id); });
    Object.keys(g.extras).forEach((id) => { owner[g.extras[id]] = nameOf(id) + '(+1)'; });
    const tiles = g.values.map((v, i) => {
      const cls = ['gtile'];
      if (i === g.mine) cls.push('mine');
      if (i === g.plus) cls.push('plus');
      if (i in owner) cls.push('taken');
      const mark = i === g.mine ? '💣' : i === g.plus ? '🎁' : g.hint.includes(i) ? '❓' : '';
      return `<div class="${cls.join(' ')}"><b>${v}</b><small>${mark}${i in owner ? esc(owner[i]) : ''}</small></div>`;
    }).join('');
    return fold('play', '🎴 地雷ゲームの盤面', `<div class="ggrid" style="grid-template-columns:repeat(${g.cols},1fr)">${tiles}</div>
      <p class="sub">💣地雷(引くと全員の報酬が25%減) 🎁+1カード ❓人狼に見えている地雷の候補3枚 ／ 引いた人の名前が下に出ます</p>
      ${g.result ? `<p class="notice ${g.result.hit ? 'warn' : ''}">${g.result.hit ? `💥 ${esc(nameOf(g.result.hitBy))}が地雷を引いた` : '地雷は出なかった'}</p>` : ''}`, g.result ? (g.result.hit ? '💥地雷が出た' : '地雷なし') : `引いた ${Object.keys(g.picks).length}人`);
  }
  function godMemory(g) {
    const rows = [];
    for (let r = 0; r < g.rounds; r++) {
      const seq = g.seqs[r];
      const cur = r + 1 === g.round;
      const ents = Object.keys(g.entries[r]).map((id) => `${esc(nameOf(id))}: <b>${g.entries[r][id].join('')}</b>`);
      const drafts = Object.keys(g.drafts[r]).filter((id) => !(id in g.entries[r])).map((id) => `${esc(nameOf(id))}: ${g.drafts[r][id].join('')}…(入力中)`);
      rows.push(`<div class="hrow"><div class="hhead"><span>${r + 1}回目${cur && !g.result ? ` (${{ ready: '準備中', show: '数字を見せている', enter: '入力中' }[g.sub] || ''})` : ''}</span><b class="mono">${seq.slice(0, g.half).join('')} ${seq.slice(g.half).join('')}</b></div>
        <p class="sub">${[...ents, ...drafts].join(' ／ ') || (cur ? '' : '入力なし')}</p></div>`);
    }
    return fold('play', '🧠 記憶ゲーム', `<p class="sub">それぞれ前半・後半の数字を見て、相手に伝え合います(左が前半、右が後半)</p>${rows.join('')}
      ${g.result ? `<p class="notice">成功率: ${Object.keys(g.result.rates).map((id) => `${esc(nameOf(id))} ${Math.round(g.result.rates[id] * 100)}%`).join(' / ')}</p>` : ''}`, `${g.round}/${g.rounds}回目`);
  }
  // 神視点のバトルは、参加者(待機中の観戦)と同じ画面(敵の絵・味方のカード・ログ)を使い、属性と奥義の条件は最初から見せる
  function godAsPlay(g) {
    return {
      god: true, spectator: true, kind: 'battle', stage: g.stage, sub: g.sub, round: g.round, rounds: g.rounds, awakened: g.awakened,
      enemy: { attr: g.enemy.attr, emoji: g.enemy.emoji, name: g.enemy.name, hp: g.enemy.hp, maxHp: g.enemy.maxHp, buff: g.enemy.buff, enraged: g.enemy.enraged, ult: g.enemy.ult },
      allies: g.allies.map((a) => ({ id: a.id, attr: a.attr, hp: a.hp, alive: a.alive, charged: a.charged, charge: a.charge, fx: a.fx })),
      logs: g.logs.map((l, i) => ({ ...l, acts: l.acts.map((a) => { const c = (g.cmdsLog[i] || {})[a.id] || {}; return { ...a, hit: a.dmg > 0, soft: !!c.soft, sab: !!c.sab }; }) })),
      over: g.over, win: g.win,
    };
  }
  function godBattle(g) {
    const e = g.enemy;
    const allies = g.allies.map((a) => {
      const c = a.cmd;
      const cmdText = g.sub === 'command' && g.stage === 'play' ? (c ? `${CMD_NAME[c.cmd]}${c.cmd === 'share' && c.target ? '→' + esc(nameOf(c.target)) : ''}${c.soft ? ' 🐺手加減' : ''}${c.sab ? ' 🐺妨害指定' : ''}` : '<small class="sub">選択中</small>') : '';
      return `<div class="gally ${a.alive ? '' : 'dead'}"><div class="gah"><b>${roleIcon(a.id)} ${esc(nameOf(a.id))}</b> <small>${ATTR[a.attr]}</small> ${fxBadges(a.fx)}</div>
        ${hpBar(a.hp, 100)}<div class="gam"><span>HP <b>${a.hp}</b></span><span>⚡${a.charge}${a.need ? `/${a.need}` : a.free ? '/?' : ''}</span><span>与ダメージ <b>${a.dealt}</b></span><span>${cmdText}</span></div></div>`;
    }).join('');
    const P = godAsPlay(g);
    return fold('play', `⚔️ バトル ラウンド${g.round}${g.awakened ? ' 😈覚醒' : ''}`, battleBody(P), `${esc(e.name)} HP${e.hp}/${e.maxHp}`)
      + fold('gcmd', '🔍 全員のコマンドとステータス', `<p class="sub">🐺 妨害コマンド: <b>${CMD_NAME[g.sabCmd]}</b></p>
      <div class="gallies">${allies}</div>
      ${g.win !== undefined ? `<p class="notice ${g.win ? '' : 'warn'}">${g.win ? '🏆 勝利' : '💀 敗北'}</p>` : ''}`, g.sub === 'command' ? `選択済み ${g.allies.filter((a) => a.cmd).length}/${g.allies.filter((a) => a.alive).length}人` : '')
;
  }
  function godDeliver() {
    const G = S.god;
    if (!G.game || G.game.stage !== 'deliver') return '';
    return fold('deliver', '📦 納品', `${S.proposal.map((id) => `<p class="sub">${roleIcon(id)} ${esc(nameOf(id))}: 報酬 <b>${G.rewards[id] !== undefined ? G.rewards[id] : '?'}</b> → ${id in G.deliveries ? `納品 <b>${G.deliveries[id]}</b>${S.mode === 'advanced' && id in G.reserves ? `・備蓄 ${G.reserves[id]}` : ''}` : '<small>決めている…</small>'}</p>`).join('')}`, `${Object.keys(G.deliveries).length}/${S.proposal.length}人`);
  }
  function godChatCard() {
    const G = S.god;
    const talk = G.chat.slice(-30).map((m) => `<div class="cm"><b>${esc(nameOf(m.id))}</b> ${esc(m.text)}</div>`).join('');
    const pair = G.pairChat.map((m) => `<div class="cm"><b>${esc(nameOf(m.id))}</b> ${esc(m.text)}</div>`).join('');
    return fold('chat', '💬 チャット(読み取り専用)', `${pair ? `<p class="sub">数字ゲーム専用チャット(2人の間だけで、数秒で消える)</p>${pair}` : ''}${talk || '<p class="sub">まだ発言はありません</p>'}`, `${G.chat.length}件`);
  }
  function godEnd() {
    const f = S.final;
    const wolves = S.players.filter((p) => f.roles[p.id] === 'wolf').map((p) => p.name);
    const head = f.aborted ? '<div class="banner aborted">🛑 ゲームは中断されました</div>'
      : `<div class="banner ${f.winner}">${f.winner === 'citizen' ? '🧑‍🌾 市民の勝利!' : '🐺 人狼の勝利!'}</div>
         <p class="center sub">${f.winner === 'citizen' ? '目標をすべて達成しました' : f.reasons.map((r) => REASON[r]).join(' / ')}</p>`;
    return `${head}<div class="card stack">${goalBlock(f.total, f.mode === 'advanced' ? f.reserveTotal : undefined)}<p class="sub">🐺 人狼: ${wolves.map(esc).join('、')}</p>
      <p class="sub center">ホストが「もう一度遊ぶ」を押すと、参加者としてロビーに入ります。</p></div>`;
  }
  function godHistory() {
    if (!S.history.length) return '';
    return fold('history', 'ターンごとの記録(完全版)', `<table><tr><th>T</th><th></th><th>メンバー 納品/引いた数${S.mode === 'advanced' ? '(備蓄・捨てた数)' : ''}</th><th>納品計</th></tr>${turnRows(S.history, S.mode)}</table>`, `${S.history.length}ターン`);
  }
  function renderGod() {
    const g = S.god && S.god.game;
    let play = '';
    if (g && S.phase === 'collect') play = g.kind === 'mine' ? godMine(g) : g.kind === 'memory' ? godMemory(g) : godBattle(g);
    app.innerHTML = `${godHeader()}<div class="foldtools"><button class="btn small" data-act="gopen">すべて開く</button><button class="btn small" data-act="gclose">すべて閉じる</button></div>${S.phase === 'end' ? godEnd() : `${godTurn()}${play}${godDeliver()}`}${godPlayers()}${S.phase === 'end' ? '' : godPlan()}${godChatCard()}${godHistory()}
      <button class="btn small" data-act="leave">観戦をやめる</button>`;
  }

  function renderGame() {
    let panel = '';
    switch (S.phase) {
      case 'discuss': panel = discussPanel(); break;
      case 'vote': panel = votePanel(); break;
      case 'voteResult': panel = voteResultPanel(); break;
      case 'collect': panel = collectPanel(); break;
      case 'result': panel = resultPanel(); break;
      case 'end': panel = endPanel(); break;
      default:
    }
    app.innerHTML = `${header()}${keeperCard()}${seerCard()}${veilCard()}${swapCard()}${panel}
      ${S.phase === 'end' ? '' : inBattle() ? abortButton() : `<div class="card stack"><h2>参加者</h2>${chips()}${S.specs && S.specs.length ? `<p class="sub">👁 観戦中: ${S.specs.map((x) => esc(x.name)).join('、')}</p>` : ''}</div>${historyCard()}${abortButton()}`}`;
  }

  // ゲーム開始時(1ターン目の最初の議論)に、自分の役職を自動で大きく表示する。途中参加・再接続では出さない。
  let roleAnnounced = false;
  function render() { renderCore(); updateChat(); TW.bgm(bgmScene()); }
  function renderCore() {
    if (!S) { roleAnnounced = false; return renderHome(); }
    if (S.spectator && S.god) return renderGod();
    if (S.phase === 'lobby') { roleAnnounced = false; return renderLobby(); }
    renderGame();
    if (!roleAnnounced && S.me.role) {
      roleAnnounced = true;
      if (S.phase === 'discuss' && S.turn === 1 && S.attempt === 1) showRole();
    }
  }

  /* ---------- 役職の表示(ゲーム開始時に自動で表示・あとからタップで再表示) ---------- */
  function showRole() {
    if (!S || !S.me.role) return;
    const o = $('#roleOverlay');
    const wolf = S.me.role === 'wolf';
    TW.play(wolf ? 'roleWolf' : 'role');
    o.className = `overlay ${wolf ? 'wolf' : 'citizen'}`;
    o.innerHTML = `<div>
      <div class="big">${wolf ? '🐺' : '🧑‍🌾'}</div>
      <div class="rname">${wolf ? '人狼' : '市民'}${S.me.job ? `(${JOBS[S.me.job].e}${JOBS[S.me.job].n})` : ''}</div>
      <p>${wolf
        ? `${roleGoal(true)}${S.mode === 'advanced' ? '<br><br>備蓄の合計は、人狼のあなたにはいつでも画面に見えています。' : ''}${S.me.job ? `<br><br>${jobHelp()}` : ''}${S.me.mates.length ? `<br><br>仲間: ${S.me.mates.map((id) => esc(nameOf(id))).join('、')}` : '<br><br>仲間はいません(単独です)'}`
        : `${roleGoal(false)}${S.me.job ? `<br><br>${jobHelp()}` : ''}`}</p>
      <p class="sub" style="margin-top:22px">タップして閉じる</p>
    </div>`;
    o.hidden = false;
  }
  const hideRole = () => { $('#roleOverlay').hidden = true; };
  $('#roleOverlay').addEventListener('click', hideRole);

  /* ---------- 操作 ---------- */
  // ボタンを押したときの効果音(決定系は「ok」、数字や調整は小さな「tick」、ほかは「tap」)
  const CLICK_SE = { tile: 'flip', vote: 'vote', cmd: 'ok', sharego: 'ok', propose: 'ok', start: 'start', deliver: 'ok', memsubmit: 'ok', memready: 'ok', create: 'ok', join: 'ok', memdigit: 'tick', memdel: 'tick', pick: 'tick', inc: 'tick', dec: 'tick', shareadj: 'tick', ultadj: 'tick', setamt: 'tick' };
  app.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.act === 'soft') { softOn = e.target.checked; return; }
    if (e.target.dataset && e.target.dataset.act === 'sab') { sabOn = e.target.checked; return; }
    const el = e.target.closest('[data-act="set"]');
    if (el) send('settings', { [el.dataset.k]: el.dataset.k === 'mode' ? el.value : Number(el.value) });
  });

  app.addEventListener('input', (e) => {
    if (e.target.classList && e.target.classList.contains('shareslider')) { shareAmt = Number(e.target.value); patchShare(); return; }
    if (e.target.classList && e.target.classList.contains('slider')) {
      if (e.target.classList.contains('rsvslider')) { rsv = Number(e.target.value); rsvAuto = false; } else amt = Number(e.target.value);
      patchAmt();
    }
  });

  app.addEventListener('click', (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const act = b.dataset.act;
    TW.play(CLICK_SE[act] || 'tap');
    switch (act) {
      case 'create': {
        const name = $('#name').value.trim();
        if (!name) return toast('ニックネームを入力してください');
        store.setName(name);
        socket.emit('create', { name }, (res) => {
          if (!res || !res.ok) return toast((res && res.error) || '作成に失敗しました');
          store.set({ code: res.code, pid: res.pid });
        });
        break;
      }
      case 'join': {
        const name = $('#name').value.trim();
        const code = $('#code').value.trim();
        if (!name) return toast('ニックネームを入力してください');
        if (!/^\d{4}$/.test(code)) return toast('4桁のコードを入力してください');
        store.setName(name);
        socket.emit('join', { name, code }, (res) => {
          if (!res || !res.ok) return toast((res && res.error) || '参加に失敗しました');
          store.set({ code: res.code, pid: res.pid });
        });
        break;
      }
      case 'copy':
        if (navigator.clipboard) navigator.clipboard.writeText(b.dataset.url).then(() => toast('コピーしました'), () => toast(b.dataset.url));
        else toast(b.dataset.url);
        break;
      case 'role': showRole(); break;
      case 'tab': lobbyTab = b.dataset.t; render(); break;
      case 'check': send('check'); break;
      case 'seer': send('seer'); break;
      case 'veil':
        if (window.confirm('このターンの納品数を完全に伏せます。よろしいですか?(残り回数を1つ使います)')) send('veil');
        break;
      case 'swaptoggle': send('swap', { on: !(S.me.swap && S.me.swap.on) }); break;
      case 'start': send('start'); break;
      case 'abort':
        if (window.confirm('ゲームを中断して、人狼の正体と記録を公開します。よろしいですか?')) send('abort');
        break;
      case 'leave':
        socket.emit('leave');
        store.clear();
        S = null;
        render();
        break;
      case 'volunteer': send('volunteer'); break;
      case 'pick': {
        const id = b.dataset.id;
        if (selected.has(id)) selected.delete(id);
        else if (selected.size < S.need) selected.add(id);
        else toast(`選べるのは${S.need}人までです`);
        render();
        break;
      }
      case 'fillvol':
        selected = new Set(S.players.filter((p) => p.volunteer).map((p) => p.id).slice(0, S.need));
        render();
        break;
      case 'clearsel': selected = new Set(); render(); break;
      case 'propose': send('propose', { ids: [...selected] }); break;
      case 'vote': send('vote', { approve: b.dataset.v === '1' }); break;
      case 'tile': justDrawn = true; send('pick', { tile: Number(b.dataset.i) }); break;
      case 'memready': send('memReady'); break;
      case 'memdigit': if (S.play && memDigits.length < S.play.len) { memDigits.push(Number(b.dataset.d)); send('memSubmit', { digits: memDigits, draft: true }); render(); } break;
      case 'memdel': memDigits.pop(); send('memSubmit', { digits: memDigits, draft: true }); render(); break;
      case 'memsubmit': send('memSubmit', { digits: memDigits }); break;
      case 'inc': if (S.my.reward !== undefined && amt < S.my.reward) amt += 1; patchAmt(); break;
      case 'dec': if (amt > 0) amt -= 1; patchAmt(); break;
      case 'setamt': {
        const v = S.my.reward;
        if (v === undefined) break;
        amt = b.dataset.v === 'zero' ? 0 : b.dataset.v === 'half' ? Math.round(v / 2) : v;
        patchAmt();
        break;
      }
      case 'rsvall': rsvAuto = true; patchAmt(); break;
      case 'rsvnone': rsvAuto = false; rsv = 0; patchAmt(); break;
      case 'deliver': send('deliver', S.mode === 'advanced' ? { amount: amt, reserve: rsv } : { amount: amt }); break;
      case 'cmdsel': cmdSel = b.dataset.c; render(); { const ci = document.querySelector('.cmdinfo'); if (ci && ci.scrollIntoView) ci.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } break;
      case 'ultadj': { const P = S.play; const myA = P && P.allies.find((a) => a.id === S.me.id); ultSpend = Math.max(1, Math.min(myA ? myA.charge : 1, ultSpend + Number(b.dataset.d))); render(); break; }
      case 'cmd': { const P = S.play; const sp = b.dataset.c === 'ultimate' && P && P.me && P.me.free ? ultSpend : undefined; cmdSel = null; send('battle', { cmd: b.dataset.c, soft: softOn, sab: sabOn, spend: sp }); break; }
      case 'sharemode': shareMode = true; shareTarget = null; render(); break;
      case 'sharecancel': shareMode = false; shareTarget = null; render(); break;
      case 'shareto': { shareTarget = b.dataset.id; shareAmt = Number(b.dataset.def); render(); break; }
      case 'shareback': shareTarget = null; render(); break;
      case 'shareadj': { const mx = Number(b.dataset.max); shareAmt = Math.max(1, Math.min(mx, shareAmt + Number(b.dataset.d))); patchShare(); break; }
      case 'sharego': { const t = shareTarget; shareMode = false; shareTarget = null; send('battle', { cmd: 'share', target: t, amount: shareAmt, soft: softOn }); break; }
      case 'gfold': if (godShut.has(b.dataset.k)) godShut.delete(b.dataset.k); else godShut.add(b.dataset.k); saveShut(); render(); break;
      case 'gopen': godShut.clear(); saveShut(); render(); break;
      case 'gclose': GOD_KEYS.forEach((k) => godShut.add(k)); saveShut(); render(); break;
      case 'again': send('again'); break;
      default:
    }
  });


  /* ---------- チャット(画面の下に固定。入力欄は作り直さないので、入力中に画面が更新されても消えません) ----------
     話し合いチャット: 全員に見えて、履歴が残る(聞き専の人もここで発言できる)。
     数字ゲーム専用チャット: そのゲームの2人だけに見えて、送った文字は数秒で消える(残ると数字を見返せて、記憶ゲームにならないため)。 */
  const chatEl = { box: $('#chat'), head: $('#chatHead'), log: $('#chatLog'), form: $('#chatForm'), input: $('#chatInput'), toggle: $('#chatToggle'), badge: $('#chatBadge'), panel: $('#chatPanel') };
  let chatCollapsed = false;
  let chatSeen = 0;
  let chatSig = '';
  let chatModeNow = null;
  function chatName(id) { return id === S.me.id ? 'あなた' : nameOf(id); }
  function updateChat() {
    const C = S && S.chat;
    if (!C) {
      chatEl.box.hidden = true; chatModeNow = null; chatSig = '';
      document.documentElement.style.setProperty('--chatH', '0px');
      return;
    }
    if (chatModeNow !== C.mode) { chatModeNow = C.mode; chatSig = ''; chatEl.input.value = ''; }
    chatEl.box.hidden = false;
    chatEl.box.classList.toggle('pair', C.mode === 'pair');
    const msgs = C.msgs;
    if (C.mode === 'talk') {
      const last = msgs.length ? msgs[msgs.length - 1].n : 0;
      if (!chatCollapsed) chatSeen = last;
      const unread = chatCollapsed ? msgs.filter((m) => m.n > chatSeen && m.id !== S.me.id).length : 0;
      chatEl.badge.hidden = !unread; chatEl.badge.textContent = unread;
      chatEl.toggle.hidden = false;
      chatEl.input.maxLength = 120;
      chatEl.input.placeholder = 'メッセージを入力';
      chatEl.head.hidden = chatCollapsed;
      chatEl.head.innerHTML = '話し合いチャット <small>全員に見えます(通話で話せない人も発言OK)</small>';
      const sig = `t${chatCollapsed}|${msgs.map((m) => m.n).join(',')}|${S.players.map((p) => p.name).join(',')}`;
      if (sig !== chatSig) {
        chatSig = sig;
        const el = chatEl.log;
        const stick = el.scrollTop + el.clientHeight >= el.scrollHeight - 30 || !el.childElementCount;
        let prevTurn = null;
        const shown = chatCollapsed ? msgs.slice(-1) : msgs;
        el.innerHTML = shown.map((m) => {
          let div = '';
          if (!chatCollapsed && m.turn !== prevTurn) { div = `<div class="cdiv">${m.turn ? `ターン${m.turn}` : 'ゲーム前'}</div>`; prevTurn = m.turn; }
          return `${div}<div class="cm ${m.id === S.me.id ? 'me' : ''}"><b>${esc(chatName(m.id))}</b> ${esc(m.text)}</div>`;
        }).join('') || '<div class="cempty">まだ発言はありません</div>';
        el.classList.toggle('one', chatCollapsed);
        if (stick) el.scrollTop = el.scrollHeight;
      }
    } else {
      chatEl.badge.hidden = true; chatEl.toggle.hidden = true;
      chatEl.input.maxLength = 30;
      chatEl.input.placeholder = '数字などを入力';
      chatEl.head.hidden = false;
      chatEl.head.innerHTML = `数字ゲーム専用チャット <small>相手にだけ見えて、<b>約${Math.round(C.life / 1000)}秒で消えます</b></small>`;
      drawBubbles(C);
    }
    document.documentElement.style.setProperty('--chatH', chatEl.box.offsetHeight + 'px');
  }
  // 数字ゲーム専用チャットの吹き出し。時間が来ると消える(サーバーの時計に合わせる)。作り直しても、フェードの進み具合は途中から続く
  function drawBubbles(C) {
    const now = Date.now() + offset;
    const live = C.msgs.filter((m) => m.until > now);
    const sig = 'p' + live.map((m) => m.n).join(',');
    if (sig === chatSig) return;
    chatSig = sig;
    chatEl.log.classList.remove('one');
    chatEl.log.innerHTML = live.map((m) => `<div class="bub ${m.id === S.me.id ? 'me' : ''}" data-until="${m.until}" style="animation-duration:${C.life}ms;animation-delay:-${Math.max(0, C.life - (m.until - now))}ms"><b>${esc(chatName(m.id))}</b> ${esc(m.text)}</div>`).join('');
  }
  setInterval(() => { if (S && S.chat && S.chat.mode === 'pair') drawBubbles(S.chat); }, 300);

  chatEl.toggle.addEventListener('click', () => { chatCollapsed = !chatCollapsed; chatSig = ''; updateChat(); });
  chatEl.form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = chatEl.input.value.trim();
    if (!text) return;
    socket.emit('chat', { text }, (res) => {
      if (res && res.ok) { chatEl.input.value = ''; }
      else if (res && res.error) toast(res.error);
    });
    chatEl.input.focus();
  });
  $('#chatSend').addEventListener('mousedown', (e) => e.preventDefault()); // 送信ボタンを押しても、キーボードを閉じない

  render();
})();

})();
</script>
